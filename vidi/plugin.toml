id = "fel/vidi"
license = "MIT"
name = "Vidi"
version = "0.3.0"
plugin_api = 24
author = "fel"
icon = "brand-youtube"
description = "Latest videos from your Vidi subscription feed."
tags = ["bar", "media", "video"]
dependencies = ["vidi", "jq"]

[[setting]]
key = "max_items"
type = "int"
label_key = "settings.max-items.label"
description_key = "settings.max-items.desc"
default = 10
min = 3
max = 30
step = 1

[[setting]]
key = "include_shorts"
type = "bool"
label_key = "settings.include-shorts.label"
description_key = "settings.include-shorts.desc"
default = false

[[setting]]
key = "show_thumbnails"
type = "bool"
label_key = "settings.show-thumbnails.label"
description_key = "settings.show-thumbnails.desc"
default = true

[[setting]]
key = "open_action"
type = "select"
label_key = "settings.open-action.label"
description_key = "settings.open-action.desc"
default = "vidi"

options = [
  { value = "vidi", label_key = "settings.open-action.vidi" },
  { value = "mpv", label_key = "settings.open-action.mpv" },
  { value = "browser", label_key = "settings.open-action.browser" },
  { value = "copy", label_key = "settings.open-action.copy" },
]

[[widget]]
id = "latest"
entry = "widget.luau"

  [widget.actions]
  middle = "none"

[[panel]]
id = "feed"
entry = "panel.luau"
width = 460
height = 600
placement = "attached"
dismiss_on_outside_click = true
