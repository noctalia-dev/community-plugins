id = "kaler/synced-lyrics"
name = "Synced Lyrics"
version = "1.1.4"
plugin_api = 43
author = "kaler"
license = "MIT"
description = "Syllable-level karaoke and line-synced lyrics on the Noctalia bar with auto-hide."
tags = ["bar", "media"]
icon = "music"

dependencies = [
  "python3",
  "systemd"
]

[[setting]]
key = "auto_hide"
type = "bool"
label_key = "settings.auto-hide.label"
description_key = "settings.auto-hide.description"
default = true

[[setting]]
key = "hide_when_paused"
type = "bool"
label_key = "settings.hide-when-paused.label"
description_key = "settings.hide-when-paused.description"
default = true

[[setting]]
key = "max_words"
type = "int"
label_key = "settings.max-words.label"
description_key = "settings.max-words.description"
default = 6
min = 2
max = 30
step = 1

[[setting]]
key = "word_wrapping_mode"
type = "select"
label_key = "settings.word-wrapping-mode.label"
description_key = "settings.word-wrapping-mode.description"
default = "words"
options = [
  { value = "words", label_key = "settings.word-wrapping-mode.options.words" },
  { value = "chars", label_key = "settings.word-wrapping-mode.options.chars" },
  { value = "full", label_key = "settings.word-wrapping-mode.options.full" },
]

[[setting]]
key = "font_size"
type = "int"
label_key = "settings.font-size.label"
description_key = "settings.font-size.description"
default = 12
min = 9
max = 24
step = 1

[[setting]]
key = "smooth_sweep"
type = "bool"
label_key = "settings.smooth-sweep.label"
description_key = "settings.smooth-sweep.description"
default = true

[[setting]]
key = "show_countdown"
type = "bool"
label_key = "settings.show-countdown.label"
description_key = "settings.show-countdown.description"
default = true

[[setting]]
key = "timing_offset_ms"
type = "int"
label_key = "settings.timing-offset.label"
description_key = "settings.timing-offset.description"
default = 0
min = -10000
max = 10000
step = 50

[[setting]]
key = "scroll_offset_step_ms"
type = "int"
label_key = "settings.scroll-step.label"
description_key = "settings.scroll-step.description"
default = 50
min = 10
max = 500
step = 10

[[setting]]
key = "invert_scroll"
type = "bool"
label_key = "settings.invert-scroll.label"
description_key = "settings.invert-scroll.description"
default = false

[[setting]]
key = "preferred_source"
type = "select"
label_key = "settings.preferred-source.label"
description_key = "settings.preferred-source.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.preferred-source.options.auto" },
  { value = "parsenix", label_key = "settings.preferred-source.options.parsenix" },
  { value = "spicylyrics", label_key = "settings.preferred-source.options.spicylyrics" },
  { value = "binimum", label_key = "settings.preferred-source.options.binimum" },
  { value = "lyricsplus", label_key = "settings.preferred-source.options.lyricsplus" },
  { value = "betterlyrics", label_key = "settings.preferred-source.options.betterlyrics" },
  { value = "unison", label_key = "settings.preferred-source.options.unison" },
  { value = "lrclib", label_key = "settings.preferred-source.options.lrclib" },
]

[[setting]]
key = "active_color"
type = "string"
label_key = "settings.active-color.label"
description_key = "settings.active-color.description"
default = "primary"

[[setting]]
key = "sung_color"
type = "string"
label_key = "settings.sung-color.label"
description_key = "settings.sung-color.description"
default = "on_surface"

[[setting]]
key = "upcoming_color"
type = "string"
label_key = "settings.upcoming-color.label"
description_key = "settings.upcoming-color.description"
default = "on_surface_variant"

[[setting]]
key = "show_glyph"
type = "bool"
label_key = "settings.show-glyph.label"
description_key = "settings.show-glyph.description"
default = true

[[setting]]
key = "max_chars"
type = "int"
label_key = "settings.max-chars.label"
description_key = "settings.max-chars.description"
default = 34
min = 15
max = 80
step = 1

[[setting]]
key = "spicy_lyrics_api_key"
type = "string"
label_key = "settings.spicylyrics-key.label"
description_key = "settings.spicylyrics-key.description"
default = ""

[[setting]]
key = "betterlyrics_api_key"
type = "string"
label_key = "settings.betterlyrics-key.label"
description_key = "settings.betterlyrics-key.description"
default = ""

[[setting]]
key = "spotify_client_id"
type = "string"
label_key = "settings.spotify-client-id.label"
description_key = "settings.spotify-client-id.description"
default = ""

[[setting]]
key = "spotify_client_secret"
type = "string"
label_key = "settings.spotify-client-secret.label"
description_key = "settings.spotify-client-secret.description"
default = ""

[[setting]]
key = "parsenix_base_url"
type = "string"
label_key = "settings.parsenix-base-url.label"
description_key = "settings.parsenix-base-url.description"
default = "https://noctalialyrics.vercel.app"

[[widget]]
id = "lyrics"
entry = "bar.luau"

[[panel]]
id = "lyrics-panel"
entry = "panel.luau"
width = 460
height = 420
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
