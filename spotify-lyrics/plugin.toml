id = "goatnath/spotify-lyrics"
name = "Spotify Lyrics"
version = "1.2.0"
plugin_api = 3
author = "goatnath"
license = "MIT"
dependencies = ["playerctl", "python3", "syncedlyrics"]
tags = ["music"]
icon = "music"
description = "Time-synced lyrics panel linked to the media widget."

# Minimal bar trigger: tiny glyph icon next to the media widget.
# Auto-hides when nothing is playing. Click to open the lyrics panel.
[[widget]]
id = "lyrics"
entry = "bar.luau"

# Lyrics panel: 3-line synced view anchored near the media area.
[[panel]]
id = "lyrics-panel"
entry = "panel.luau"
width = 460
height = 280

[[desktop_widget]]
id = "lyrics-desktop"
entry = "widget.luau"
