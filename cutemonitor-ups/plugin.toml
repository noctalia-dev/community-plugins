# CuteMonitor — UPS Status
#
# Live UPS status on the Noctalia desktop, read from CyberPower's pwrstat or from
# NUT. One headless [[service]] polls the chosen data source and publishes a
# normalized snapshot, graph series and an event log through noctalia.state; the
# desktop widget, bar item and panel are thin clients that only render that state.

id = "cutecaption/cutemonitor-ups"
name = "CuteMonitor — UPS Status"
version = "0.1.1"
# API 29 is for the panel graph's hover tracking; nothing else needs more
# than 24.
plugin_api = 43
author = "cutecaption"
license = "MIT"
icon = "plug-connected"
description = "Live UPS status from pwrstat or NUT on your desktop."
tags = ["desktop", "bar", "panel", "service", "hardware", "system", "indicator"]

# Commands the plugin runs. Only one data source is needed: pwrstat (CyberPower
# PowerPanel) or upsc (NUT). upscmd runs NUT panel actions inside a terminal.
dependencies = ["pwrstat", "upsc", "upscmd"]

# Plugin-wide settings (Settings → Plugins → gear)

[[setting]]
key = "data_source"
type = "select"
label_key = "settings.data_source.label"
description_key = "settings.data_source.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.data_source.options.auto" },
  { value = "pwrstat", label_key = "settings.data_source.options.pwrstat" },
  { value = "nut", label_key = "settings.data_source.options.nut" },
]

[[setting]]
key = "nut_ups"
type = "string"
label_key = "settings.nut_ups.label"
description_key = "settings.nut_ups.description"
default = ""
visible_when = { key = "data_source", values = ["auto", "nut"] }

[[setting]]
key = "poll_interval"
type = "select"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = "1"
options = [
  { value = "1", label_key = "settings.poll_interval.options.1" },
  { value = "2", label_key = "settings.poll_interval.options.2" },
  { value = "5", label_key = "settings.poll_interval.options.5" },
  { value = "10", label_key = "settings.poll_interval.options.10" },
  { value = "30", label_key = "settings.poll_interval.options.30" },
  { value = "60", label_key = "settings.poll_interval.options.60" },
]

[[setting]]
key = "high_load"
type = "int"
label_key = "settings.high_load.label"
description_key = "settings.high_load.description"
default = 80
min = 10
max = 100
step = 5

[[setting]]
key = "date_style"
type = "select"
label_key = "settings.date_style.label"
default = "short"
options = [
  { value = "short", label_key = "settings.date_style.options.short" },
  { value = "pwrstat", label_key = "settings.date_style.options.pwrstat" },
  { value = "relative", label_key = "settings.date_style.options.relative" },
]

# Event-log recording switches (the log keeps the newest 200 events).
[[setting]]
key = "log_outages"
type = "bool"
label_key = "settings.log_outages.label"
description_key = "settings.log_outages.description"
default = true

[[setting]]
key = "log_communication"
type = "bool"
label_key = "settings.log_communication.label"
description_key = "settings.log_communication.description"
default = false

[[setting]]
key = "log_self_test"
type = "bool"
label_key = "settings.log_self_test.label"
default = false

[[setting]]
key = "log_voltage"
type = "bool"
label_key = "settings.log_voltage.label"
description_key = "settings.log_voltage.description"
default = true

[[setting]]
key = "log_line_events"
type = "bool"
label_key = "settings.log_line_events.label"
description_key = "settings.log_line_events.description"
default = true

# Service: polls the data source, owns history, events and actions

[[service]]
id = "service"
entry = "service.luau"

