# Bar item

[[widget]]
id = "bar"
entry = "bar.luau"

  # Gesture defaults; users rebind them per instance. Middle click keeps
  # Noctalia's default (open this widget's settings).
  [widget.actions]
  left = "panel-toggle cutecaption/cutemonitor-ups:details"
  right = "none"

  [[widget.setting]]
  key = "display_mode"
  type = "select"
  label_key = "settings.display_mode.label"
  default = "icon"
  options = [
    { value = "icon", label_key = "settings.display_mode.options.icon" },
    { value = "battery", label_key = "settings.display_mode.options.battery" },
    { value = "none", label_key = "settings.display_mode.options.none" },
  ]

  # The bar's text follows its foreground color by itself; the drawn battery is
  # built from boxes, which need an explicit color.
  [[widget.setting]]
  key = "battery_color"
  type = "color"
  label_key = "settings.battery_color.label"
  description_key = "settings.battery_color.description"
  default = "on_surface"
  visible_when = { key = "display_mode", values = ["battery"] }

  [[widget.setting]]
  key = "show_label"
  type = "bool"
  label_key = "settings.show_label.label"
  default = true

  [[widget.setting]]
  key = "label_content"
  type = "select"
  label_key = "settings.label_content.label"
  default = "battery_load"
  visible_when = { key = "show_label", values = ["true"] }
  options = [
    { value = "battery_load", label_key = "settings.label_content.options.battery_load" },
    { value = "battery", label_key = "stats.battery_pct" },
    { value = "load", label_key = "stats.load_pct" },
    { value = "load_w", label_key = "stats.load_w" },
    { value = "runtime", label_key = "stats.runtime" },
  ]

  [[widget.setting]]
  key = "only_on_battery"
  type = "bool"
  label_key = "settings.only_on_battery.label"
  description_key = "settings.only_on_battery.description"
  default = false

  [[widget.setting]]
  key = "warning_color"
  type = "color"
  label_key = "settings.warning_color.label"
  description_key = "settings.warning_color.description"
  default = "tertiary"

  [[widget.setting]]
  key = "alert_color"
