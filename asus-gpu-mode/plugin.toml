id = "baizhu/asus-gpu-mode"
name = "ASUS GPU Mode Switcher"
version = "1.0.0"
plugin_api = 24
author = "cod3d (v4 original; v5 port by baizhu945)"
license = "MIT"
dependencies = ["supergfxctl"]
tags = ["hardware", "gaming", "system", "panel", "shortcut"]
icon = "device-desktop"
description = "Switch ASUS laptop GPU modes with current, pending, and required-action status."

[[setting]]
key = "asus_gpu_debug"
type = "bool"
label_key = "settings.asus_gpu_debug.label"
description_key = "settings.asus_gpu_debug.description"
default = false
advanced = true

[[setting]]
key = "asus_gpu_patch_pending"
type = "bool"
label_key = "settings.asus_gpu_patch_pending.label"
description_key = "settings.asus_gpu_patch_pending.description"
default = true

[[setting]]
key = "asus_gpu_polling"
type = "bool"
label_key = "settings.asus_gpu_polling.label"
description_key = "settings.asus_gpu_polling.description"
default = false

[[setting]]
key = "asus_gpu_polling_interval_ms"
type = "int"
label_key = "settings.asus_gpu_polling_interval_ms.label"
description_key = "settings.asus_gpu_polling_interval_ms.description"
default = 3000
min = 1000
max = 60000
step = 250
advanced = true

[[shortcut]]
id = "gpu-mode-shortcut"
entry = "gpu_mode_shortcut.luau"

[[panel]]
id = "gpu-mode-panel"
entry = "gpu_mode_panel.luau"
width = 420
height = 230
placement = "attached"
position = "top_right"
