name: Feature Request
description: Suggest an improvement to a community plugin
title: "[FEATURE] "
labels: ["feature"]
type: "Feature"

body:
  - type: checkboxes
    id: submission-checklist
    attributes:
      label: Submission checklist
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues and confirmed this has not been requested before.
          required: true
        - label: I have checked existing pull requests for similar changes.
          required: true
        - label: This is about a community plugin, not about Noctalia itself (those belong in the noctalia repo).
          required: true

  - type: dropdown
    id: plugin-id
    attributes:
      label: Plugin
      description: The plugin id.
      default: 0
      options:
        - --- SELECT ---
        - 9router-control
        - ai-usagebar
        - anilist
        - arch-updater
        - asus-fan
        - audio-switcher
        - battery-graph
        - battery-power-management
        - battery-threshold
        - battery-widget
        - bazaarsearch
        - better-clock
        - bookmarks
        - calculator
        - cat
        - cider
        - claude-companion
        - codexbar-meter
        - color_picker
        - config-swap
        - custom-shortcut
        - daily-wallpaper
        - deepseek_usage
        - discord-voice
        - dns-switcher
        - drive-health
        - dropwall
        - ds4-color
        - eyecare
        - file-search
        - game-launcher
        - gamer-mode
        - git_companion
        - github-prs
        - gocryptfs
        - godot-provider
        - gslapper
        - hassio
        - hotspot
        - hypr-layout-switcher
        - hypr-screen-mirror
        - hypr-submap
        - ideapad-conservation-mode
        - iio_lock
        - imagemagick-clock
        - ip-monitor
        - jetbrains-provider
        - k8s-status
        - keybind-cheatsheet
        - keymap
        - kineticwe-layouts
        - lid-guard
        - link-ip-monitor
        - llamanager
        - lrc
        - lyrics
        - mango_layouts
        - mangowm-keymode
        - mawaqit
        - mihomo-control
        - mimir
        - mini-docker
        - nextboot-selector
        - niri-active-workspace
        - niri-animations
        - niri-displays
        - nix-monitor
        - noctwhspr
        - nvtop
        - obs-integration
        - obsidian
        - ocr
        - opencode-companion
        - opencodex-bar
        - opnsense
        - palette-creator
        - pass
        - phone-connect
        - phone-operate
        - pomodoro
        - portctl
        - prismlauncher-instances
        - procmon
        - proton-pass
        - pulsar-mouse
        - qrcode
        - rss-notifier
        - ruh-vpn
        - screen-toolkit
        - sharednd
        - shell-command
        - shelly
        - special-workspaces
        - spotify-lyrics
        - ssh-launcher
        - syncthing
        - system-monitor
        - system-updater
        - tailnet
        - tailscale
        - thinkpad-fan
        - thinkpad-led
        - thunderbird-companion
        - tmux-provider
        - todo
        - topgrade-wrapper
        - udiskie
        - um5606_fan_state
        - upbeat
        - voxtype
        - w-engine
        - wallpaper-switcher
        - web-launcher
        - wireview-pro-ii
        - wl-screen-mirror
        - zed-provider

    validations:
      required: true


  - type: dropdown
    id: feature-type
    attributes:
      label: Feature type
      description: What kind of feature or improvement is this?
      options:
        - UI / visual improvement
        - New functionality
        - Performance improvement
        - Configuration / customization
        - Accessibility improvement
        - Integration support
        - Documentation improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: A concise description of the feature or enhancement.
      placeholder: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / use case
      description: |
        Why would this feature be useful?
        What problem does it solve or improve?
      placeholder: Explain the benefit or real-world use case...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: |
        Describe how you think this could work.

        Mockups, examples, screenshots, or references are welcome.
      placeholder: Describe your idea...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Have you considered any alternative solutions or workarounds?
      placeholder: Optional...

  - type: textarea
    id: references
    attributes:
      label: References / related projects
      description: |
        Link any related projects, concepts, screenshots, issues, or examples here.
      placeholder: |
        https://github.com/...
        https://example.com/...

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Add any additional information, screenshots, mockups, or context here.
