name: Mark Pull Request Ready After Plugin Author Reply

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready-after-author-reply:
    if: github.repository == 'noctalia-dev/community-plugins' && github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/workflows/setup/pygithub

      - name: Mark Ready After Author Reply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: python3 .github/workflows/scripts/pr-mark-ready-on-author-reply.py
