id = "tphilippot/git_companion"
name = "Git Companion"
version = "1.1.0"
plugin_api = 23
author = "thomas-philippot"
license = "MIT"
icon = "brand-git"
description = "Monitor your git repositories from the Noctalia bar. See your current PRs/MRs and issues at a glance."
tags = ["development", "bar", "panel", "service", "productivity"]
dependencies = ["gh", "glab", "xdg-open"]

# ── Plugin-level settings ────────────────────────────────────

[[setting]]
key = "platform"
type = "select"
label_key = "settings.platform.label"
description_key = "settings.platform.description"
default = "github"
options = [
  { value = "github", label_key = "settings.platform.options.github" },
  { value = "gitlab", label_key = "settings.platform.options.gitlab" }
]

[[setting]]
key = "repo"
type = "string"
label_key = "settings.repo.label"
description_key = "settings.repo.description"
default = ""

[[setting]]
key = "group"
type = "string"
label_key = "settings.group.label"
description_key = "settings.group.description"
default = ""

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 60
min = 10

[[setting]]
key = "bar_display_mode"
type = "select"
label_key = "settings.bar_display_mode.label"
description_key = "settings.bar_display_mode.description"
default = "both"
options = [
  { value = "none", label_key = "settings.bar_display_mode.options.none" },
  { value = "prs", label_key = "settings.bar_display_mode.options.prs" },
  { value = "issues", label_key = "settings.bar_display_mode.options.issues" },
  { value = "both", label_key = "settings.bar_display_mode.options.both" }
]

# Tab visibility. Each list is only fetched when its tab is shown.
[[setting]]
key = "show_prs"
type = "bool"
label_key = "settings.show_prs.label"
description_key = "settings.show_prs.description"
default = true

[[setting]]
key = "show_issues"
type = "bool"
label_key = "settings.show_issues.label"
description_key = "settings.show_issues.description"
default = true

[[setting]]
key = "show_reviews"
type = "bool"
label_key = "settings.show_reviews.label"
description_key = "settings.show_reviews.description"
default = true

# Hidden while the Code Review tab is off, since it would have no effect.
[[setting]]
key = "count_reviews_with_prs"
type = "bool"
label_key = "settings.count_reviews_with_prs.label"
description_key = "settings.count_reviews_with_prs.description"
default = false
visible_when = { key = "show_reviews", values = ["true"] }

# Branch badges: one list of branch patterns per theme colour. Declaration
# order is match priority — the first bucket holding a matching pattern wins.
[[setting]]
key = "branch_badge_primary"
type = "string_list"
label_key = "settings.branch_badge_primary.label"
description_key = "settings.branch_badge.description"
default = ["develop"]

[[setting]]
key = "branch_badge_secondary"
type = "string_list"
label_key = "settings.branch_badge_secondary.label"
description_key = "settings.branch_badge.description"
default = ["release/*"]

[[setting]]
key = "branch_badge_tertiary"
type = "string_list"
label_key = "settings.branch_badge_tertiary.label"
description_key = "settings.branch_badge.description"
default = []

[[setting]]
key = "branch_badge_alert"
type = "string_list"
label_key = "settings.branch_badge_alert.label"
description_key = "settings.branch_badge.description"
default = ["master", "main"]

# ── Entryfiles ────────────────────────────────────

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "widget"
entry = "widget.luau"

[[panel]]
id = "main"
entry = "panel.luau"
placement = "attached"
open_near_click = true
