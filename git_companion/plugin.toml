id = "tphilippot/git_companion"
name = "Git Companion"
version = "2.1.0"
plugin_api = 43
author = "thomas-philippot"
license = "MIT"
icon = "brand-git"
description = "Monitor your git repositories from the Noctalia bar. See your current PRs/MRs and issues at a glance."
tags = ["development", "bar", "panel", "service", "productivity"]
dependencies = ["gh", "glab", "gt", "xdg-open"]

# ── Plugin-level settings ────────────────────────────────────

[[setting]]
key = "platform"
type = "select"
label_key = "settings.platform.label"
description_key = "settings.platform.description"
default = "github"
options = [
  { value = "github", label_key = "settings.platform.options.github" },
  { value = "gitlab", label_key = "settings.platform.options.gitlab" },
  { value = "gitea", label_key = "settings.platform.options.gitea" }
]

[[setting]]
key = "repo"
type = "string"
label_key = "settings.repo.label"
description_key = "settings.repo.description"
default = ""

[[setting]]
key = "group"
type = "string"
label_key = "settings.group.label"
description_key = "settings.group.description"
default = ""

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 60
min = 10

[[setting]]
key = "bar_display_mode"
type = "select"
label_key = "settings.bar_display_mode.label"
description_key = "settings.bar_display_mode.description"
default = "both"
options = [
  { value = "none", label_key = "settings.bar_display_mode.options.none" },
  { value = "prs", label_key = "settings.bar_display_mode.options.prs" },
  { value = "issues", label_key = "settings.bar_display_mode.options.issues" },
  { value = "both", label_key = "settings.bar_display_mode.options.both" }
]

# How the tab buttons read: simple (text), full (text with the tab glyph) or
# compact (the glyph and count, with the tab name as a tooltip).
[[setting]]
key = "tab_style"
type = "select"
label_key = "settings.tab_style.label"
description_key = "settings.tab_style.description"
default = "simple"
options = [
  { value = "simple", label_key = "settings.tab_style.options.simple" },
  { value = "full", label_key = "settings.tab_style.options.full" },
  { value = "compact", label_key = "settings.tab_style.options.compact" }
]

# Tab visibility. Each list is only fetched when its tab is shown.
[[setting]]
key = "show_prs"
type = "bool"
label_key = "settings.show_prs.label"
description_key = "settings.show_prs.description"
default = true

[[setting]]
key = "show_issues"
type = "bool"
label_key = "settings.show_issues.label"
description_key = "settings.show_issues.description"
default = true

[[setting]]
key = "show_reviews"
type = "bool"
label_key = "settings.show_reviews.label"
description_key = "settings.show_reviews.description"
default = true

# Hidden while the Code Review tab is off, since it would have no effect.
[[setting]]
key = "count_reviews_with_prs"
type = "bool"
label_key = "settings.count_reviews_with_prs.label"
description_key = "settings.count_reviews_with_prs.description"
default = false
visible_when = { key = "show_reviews", values = ["true"] }

# Gitea has no deployments API, so the Deploys tab never shows there.
[[setting]]
key = "show_deploys"
type = "bool"
label_key = "settings.show_deploys.label"
description_key = "settings.show_deploys.description"
default = true
visible_when = { key = "platform", values = ["gitlab", "github"] }

# The two Deploys settings are hidden while the tab is off. A setting takes
# one visibility condition only, so they follow show_deploys rather than the
# platform.
# Repositories of the Deploys tab. Empty uses `repo`; with neither, the tab is
# hidden.
[[setting]]
key = "deploy_repos"
type = "string_list"
label_key = "settings.deploy_repos.label"
description_key = "settings.deploy_repos.description"
default = []
visible_when = { key = "show_deploys", values = ["true"] }

# Environments left out of the Deploys tab, in every followed repository:
# exact names or prefixes ending in `*` (`bot-*`), matched without case.
[[setting]]
key = "deploy_hidden_envs"
type = "string_list"
label_key = "settings.deploy_hidden_envs.label"
description_key = "settings.deploy_hidden_envs.description"
default = []
visible_when = { key = "show_deploys", values = ["true"] }

# Merge status notifications: one toggle per status worth acting on (see
# status.luau). Gitea reports no CI status, so the pipeline toggle is hidden there.
[[setting]]
key = "notify_mr_mergeable"
type = "bool"
label_key = "settings.notify_mr_mergeable.label"
description_key = "settings.notify_mr_mergeable.description"
default = true

[[setting]]
key = "notify_mr_pipeline_failed"
type = "bool"
label_key = "settings.notify_mr_pipeline_failed.label"
description_key = "settings.notify_mr_pipeline_failed.description"
default = true
visible_when = { key = "platform", values = ["gitlab", "github"] }

[[setting]]
key = "notify_mr_conflict"
type = "bool"
label_key = "settings.notify_mr_conflict.label"
description_key = "settings.notify_mr_conflict.description"
default = true

[[setting]]
key = "notify_mr_changes_requested"
type = "bool"
label_key = "settings.notify_mr_changes_requested.label"
description_key = "settings.notify_mr_changes_requested.description"
default = true

# Branch badges: one list of branch patterns per theme colour. Declaration
# order is match priority — the first bucket holding a matching pattern wins.
[[setting]]
key = "branch_badge_primary"
type = "string_list"
label_key = "settings.branch_badge_primary.label"
description_key = "settings.branch_badge.description"
default = ["develop"]

[[setting]]
key = "branch_badge_secondary"
type = "string_list"
label_key = "settings.branch_badge_secondary.label"
description_key = "settings.branch_badge.description"
default = ["release/*"]

[[setting]]
key = "branch_badge_tertiary"
type = "string_list"
label_key = "settings.branch_badge_tertiary.label"
description_key = "settings.branch_badge.description"
default = []

[[setting]]
key = "branch_badge_alert"
type = "string_list"
label_key = "settings.branch_badge_alert.label"
description_key = "settings.branch_badge.description"
default = ["master", "main"]

# ── Entryfiles ────────────────────────────────────

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "widget"
entry = "widget.luau"

[[panel]]
id = "main"
entry = "panel.luau"
placement = "attached"
open_near_click = true
