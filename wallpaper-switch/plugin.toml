# Wallpaper Switch - cycle, step, or randomize the wallpaper from a bar widget.
#
# Left click / scroll down: next wallpaper
# Right click / scroll up:   previous wallpaper
# Middle click:              random wallpaper
#
# The widget reads the wallpaper folder for the current theme mode, finds the
# wallpaper currently applied, and steps through the images with the native
# Noctalia wallpaper API (noctalia.setWallpaper). It spawns no processes except
# a periodic `noctalia msg wallpaper-get` read to keep its tooltip in sync with
# changes made outside the widget (picker, other plugins).

id = "kavya-nama/wallpaper-switch"
name = "Wallpaper Switch"
version = "1.0.0"
plugin_api = 14
author = "kavya-nama"
license = "MIT"
icon = "photo"
description = "Cycle, step, or randomize the wallpaper from a bar widget."
tags = ["bar", "wallpaper", "utility"]

[[widget]]
id = "cycle"
entry = "cycle.luau"

  # Free the middle button from the built-in "open settings" binding so the
  # script can use it for a random wallpaper.
  [widget.actions]
  middle = "none"

  [[widget.setting]]
  key = "glyph"
  type = "string"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "photo"

  [[widget.setting]]
  key = "notify_on_switch"
  type = "bool"
  label_key = "settings.notify_on_switch.label"
  description_key = "settings.notify_on_switch.description"
  default = true

  [[widget.setting]]
  key = "show_name"
  type = "bool"
  label_key = "settings.show_name.label"
  description_key = "settings.show_name.description"
  default = false