# To Do — a prioritised task list on the bar. Click the glyph to toggle a panel
# of editable task rows: add with + or N (new tasks land at the top), tick to
# complete (the text is struck through), edit or delete with the row's own
# buttons, and click each row's colour chip to cycle its priority (important →
# medium → low). Right-click a task for the same actions plus an explicit
# priority pick, in a native context menu. The footer carries bulk actions
# too: mark every task done/undone, and set every task to one priority. A
# header toggle switches ordering between priority (auto-sorted) and manual,
# where a ☰ grip on each row drags it to reorder. A row's calendar glyph opens
# a date picker (day, time or all day) to set a due date; a task past its due
# date is overdue and makes the bar glyph blink until it is done or postponed.
# The whole list is a single JSON file in the configured folder; no external
# commands are run.

id = "nightwatch75/todo"
name = "To Do"
version = "1.3.0"
# 42 for the panel's height = "content" (noctalia >= 5.4.0). 28 for
# panel.openContextMenu: the row's right-click menu carries edit, priority,
# due date and delete. 23 for noctalia.readFileAsync: the bar widget re-reads
# todo.json every 2 seconds without blocking the bar.
plugin_api = 42
author = "nightwatch75"
license = "MIT"
dependencies = []
tags = ["bar", "panel", "productivity"]
icon = "checklist"
description = "A prioritised task list with a bar widget and editable panel."

# Plugin-level settings, shared by the panel (reads/writes the task file,
# plays the completion sound) and the bar widget (reads the folder for the
# pending/overdue counts, plays the overdue sound).
[[setting]]
key = "todo_folder"
type = "folder"
label_key = "settings.todo_folder.label"
description_key = "settings.todo_folder.description"

[[setting]]
key = "sound_on_complete"
type = "bool"
label_key = "settings.sound_on_complete.label"
description_key = "settings.sound_on_complete.description"
default = true

[[setting]]
key = "sound_on_overdue"
type = "bool"
label_key = "settings.sound_on_overdue.label"
description_key = "settings.sound_on_overdue.description"
default = true

[[panel]]
id = "panel"
entry = "panel.luau"
width = 700
height = "content"
max_height = 600
placement = "attached"
open_near_click = true
# "n"/"s" reach onKey only while no ui.input has focus (the host reserves
# printable keys for a focused text field) — see panel.luau's onKey guard.
# Return/Escape are deliberately not captured: Return already reaches the
# editing ui.input's onSubmit, and Escape can never be captured by a panel
# (the host always reserves it to close/dismiss).
capture_keys = ["n", "s"]

[[widget]]
id = "todo"
entry = "todo.luau"

  # Left click toggles the panel — declared here instead of hard-coded in
  # todo.luau's onClick, so the user can remap it from the bar's own gesture
  # settings like any built-in widget.
  [widget.actions]
  left = "panel-toggle nightwatch75/todo:panel"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "checklist"

  [[widget.setting]]
  key = "show_label"
  type = "bool"
  label_key = "settings.show_label.label"
  description_key = "settings.show_label.description"
  default = true

  [[widget.setting]]
  key = "label"
  type = "string"
  label_key = "settings.label.label"
  description_key = "settings.label.description"
  default = "To Do"

  [[widget.setting]]
  key = "count_mode"
  type = "select"
  label_key = "settings.count_mode.label"
  description_key = "settings.count_mode.description"
  default = "total"
  options = [
    { value = "total", label_key = "settings.count_mode.options.total" },
    { value = "pending", label_key = "settings.count_mode.options.pending" },
    { value = "both", label_key = "settings.count_mode.options.both" },
  ]
