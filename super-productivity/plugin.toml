id          = "redxtech/super-productivity"
name        = "Super Productivity"
version     = "1.0.0"
plugin_api  = 24
author      = "Gabe Dunn"
license     = "MIT"
icon        = "checks"
description = "Show, capture, complete, track, snooze, and open Super Productivity tasks from Noctalia."
tags        = ["bar", "panel", "service", "launcher", "productivity"]
dependencies = ["python3", "xdg-open", "flatpak"]

[[setting]]
key             = "auto_start"
type            = "bool"
label_key       = "settings.auto_start.label"
description_key = "settings.auto_start.description"
default         = false

[[setting]]
key             = "launch_method"
type            = "select"
label_key       = "settings.launch_method.label"
description_key = "settings.launch_method.description"
default         = "auto"

  [[setting.options]]
  value     = "auto"
  label_key = "settings.launch_method.auto"

  [[setting.options]]
  value     = "flatpak"
  label_key = "settings.launch_method.flatpak"

  [[setting.options]]
  value     = "native"
  label_key = "settings.launch_method.native"

[[setting]]
key             = "native_command"
type            = "string"
label_key       = "settings.native_command.label"
description_key = "settings.native_command.description"
default         = "superproductivity"
visible_when    = { key = "launch_method", values = ["auto", "native"] }

[[setting]]
key             = "bridge_dir"
type            = "string"
label_key       = "settings.bridge_dir.label"
description_key = "settings.bridge_dir.description"
default         = ""

[[setting]]
key             = "poll_seconds"
type            = "int"
label_key       = "settings.poll_seconds.label"
description_key = "settings.poll_seconds.description"
default         = 2
min             = 1
max             = 30

[[setting]]
key             = "prefer_tracked_task"
type            = "bool"
label_key       = "settings.prefer_tracked_task.label"
description_key = "settings.prefer_tracked_task.description"
default         = true

[[setting]]
key             = "show_timer_controls"
type            = "bool"
label_key       = "settings.show_timer_controls.label"
description_key = "settings.show_timer_controls.description"
default         = true

[[setting]]
key             = "sound_on_complete"
type            = "bool"
label_key       = "settings.sound_on_complete.label"
description_key = "settings.sound_on_complete.description"
default         = true

[[setting]]
key             = "notify_due"
type            = "bool"
label_key       = "settings.notify_due.label"
description_key = "settings.notify_due.description"
default         = false

[[setting]]
key             = "overdue_text_color"
type            = "color"
label_key       = "settings.overdue_text_color.label"
description_key = "settings.overdue_text_color.description"
default         = "error"

[[setting]]
key             = "max_upcoming"
type            = "int"
label_key       = "settings.max_upcoming.label"
description_key = "settings.max_upcoming.description"
default         = 30
min             = 5
max             = 50

[[service]]
id    = "service"
entry = "service.luau"

[[widget]]
id    = "next-task"
entry = "widget.luau"

  [widget.actions]
  middle = "none"

  [[widget.setting]]
  key             = "glyph"
  type            = "glyph"
  label_key       = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default         = "checks"

  [[widget.setting]]
  key             = "show_due_text"
  type            = "bool"
  label_key       = "settings.show_due_text.label"
  description_key = "settings.show_due_text.description"
  default         = true

  [[widget.setting]]
  key             = "max_title_chars"
  type            = "int"
  label_key       = "settings.max_title_chars.label"
  description_key = "settings.max_title_chars.description"
  default         = 36
  min             = 12
  max             = 80

[[panel]]
id              = "details"
entry           = "panel.luau"
width           = 470
height          = 650
placement       = "attached"
position        = "auto"
open_near_click = true

[[launcher_provider]]
id                       = "capture"
entry                    = "launcher.luau"
prefix                   = "sp"
glyph                    = "checks"
include_in_global_search = false
debounce_ms              = 0
