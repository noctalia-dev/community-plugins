id = "rylos/remmina"
name = "Remmina"
version = "1.0.0"
plugin_api = 24
author = "Marco Ziliani"
license = "MIT"
icon = "screen-share"
description = "Open your saved Remmina connections from the launcher, the bar, or a panel."
tags = ["launcher", "bar", "panel", "network", "utility", "productivity"]
dependencies = ["remmina"]

[[widget]]
id = "bar"
entry = "widget.luau"

# Attached to the bar and opened next to the click, so the panel appears under
# the widget that opened it rather than in the middle of the screen.
[[panel]]
id = "connections"
entry = "panel.luau"
width = 380
height = 520
placement = "attached"
position = "auto"
open_near_click = true

[[launcher_provider]]
id = "launcher"
entry = "launcher.luau"
prefix = "rmn"
glyph = "screen-share"
include_in_global_search = false
debounce_ms = 0

[[setting]]
key = "profiles_path"
type = "file"
label_key = "settings.profiles_path.label"
description_key = "settings.profiles_path.description"
default = "~/.local/share/remmina"

[[setting]]
key = "show_group"
type = "bool"
label_key = "settings.show_group.label"
description_key = "settings.show_group.description"
default = true

[[setting]]
key = "max_results"
type = "int"
label_key = "settings.max_results.label"
description_key = "settings.max_results.description"
default = 30
min = 1
max = 200
