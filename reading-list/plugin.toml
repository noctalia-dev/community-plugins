id          = "ahmedhossamdev/reading-list"
name        = "Reading List"
version     = "1.0.1"
plugin_api  = 26
author      = "ahmedhossamdev"
license     = "MIT"
icon        = "bookmarks"
description = "Save articles, books, and images locally with collections, reading progress, sharing, and Obsidian-friendly notes."
tags        = ["bar", "panel", "service", "productivity", "utility"]
dependencies = ["xdg-open", "python3"]

[[widget]]
id    = "bar"
entry = "bar.luau"

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 580
height          = 640
placement       = "attached"
position        = "auto"
open_near_click = true

[[service]]
id    = "service"
entry = "service.luau"

[[setting]]
key             = "save_path"
type            = "string"
label_key       = "settings.save-path"
description_key = "settings.save-path-desc"
default         = "~/Documents/Reading List"

[[setting]]
key             = "show_unread_count"
type            = "bool"
label_key       = "settings.show-unread-count"
description_key = "settings.show-unread-count-desc"
default         = true

[[setting]]
key             = "fetch_metadata"
type            = "bool"
label_key       = "settings.fetch-metadata"
description_key = "settings.fetch-metadata-desc"
default         = true

[[setting]]
key             = "download_previews"
type            = "bool"
label_key       = "settings.download-previews"
description_key = "settings.download-previews-desc"
default         = true

[[setting]]
key             = "sync_external_changes"
type            = "bool"
label_key       = "settings.sync-external"
description_key = "settings.sync-external-desc"
default         = true
