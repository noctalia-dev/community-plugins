id = "ajsem1337/system-menu"
name = "System Menu"
version = "1.2.2"
plugin_api = 43
author = "ajsem1337"
license = "MIT"
description = "System menu with an Arch package browser, your choice of terminal and AUR helper, btop and system information."
icon = "device-desktop"
tags = ["bar", "panel", "system", "utility", "arch"]
dependencies = ["python3", "fastfetch", "btop", "fzf", "downgrade", "traur", "xdg-open"]

[[setting]]
key = "terminal"
type = "string"
label_key = "settings.terminal.label"
description_key = "settings.terminal.description"
default = "kitty"

[[setting]]
key = "aur_helper"
type = "string"
label_key = "settings.aur_helper.label"
description_key = "settings.aur_helper.description"
default = "paru"

[[setting]]
key = "show_terminal_arguments"
type = "bool"
label_key = "settings.show_terminal_arguments.label"
description_key = "settings.show_terminal_arguments.description"
default = false

[[setting]]
key = "terminal_args"
type = "string_list"
label_key = "settings.terminal_args.label"
description_key = "settings.terminal_args.description"
default = []
visible_when = { key = "show_terminal_arguments", values = ["true"] }

[[setting]]
key = "terminal_exec_args"
type = "string_list"
label_key = "settings.terminal_exec_args.label"
description_key = "settings.terminal_exec_args.description"
default = ["-e"]
visible_when = { key = "show_terminal_arguments", values = ["true"] }

[[widget]]
id = "button"
entry = "widget.luau"

[[panel]]
id = "menu"
entry = "menu.luau"
width = 300
height = "content"
max_height = 340
placement = "attached"
position = "auto"
open_near_click = true

[[panel]]
id = "about"
entry = "about.luau"
width = 640
height = 740
placement = "floating"
position = "center"
open_near_click = false
persistent = true
dismiss_on_outside_click = false
keyboard_focus = "on_demand"
