id          = "goldesquemoon/internal-keyboard"
name        = "Internal Keyboard"
version     = "1.3.0"
plugin_api  = 39
author      = "goldesquemoon"
license     = "MIT"
icon        = "keyboard"
description = "Turn the built-in laptop keyboard on or off from the control center, a bar widget, or a TTY."
tags        = ["hardware", "system", "utility", "shortcut"]
dependencies = ["sudo", "udevadm", "sh"]

[[setting]]
key             = "backend"
type            = "string"
label_key       = "settings.backend.label"
description_key = "settings.backend.description"
default         = "/usr/local/bin/internal-keyboard"
advanced        = true

[[setting]]
key             = "device"
type            = "string"
label_key       = "settings.device.label"
description_key = "settings.device.description"
default         = ""

[[setting]]
key             = "show_osd"
type            = "bool"
label_key       = "settings.show_osd.label"
description_key = "settings.show_osd.description"
default         = true

[[setting]]
key             = "poll_interval"
type            = "int"
label_key       = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default         = 2000
min             = 500
max             = 60000

[[service]]
id    = "service"
entry = "service.luau"

[[shortcut]]
id    = "toggle"
entry = "shortcut.luau"

[[widget]]
id    = "keyboard"
entry = "widget.luau"
