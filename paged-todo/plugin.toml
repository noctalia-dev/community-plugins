id = "baizhu/paged-todo"
name = "Paged Todo List"
version = "1.0.0"
# API 22 is required for relative Luau modules (require("./data.luau")).
# Other used capabilities are older: submitOnEnter/multiline input (21),
# widget gesture actions (14), nowMs (12), and panel drag-and-drop (5).
plugin_api = 22
author = "lonerOrz (v4 original; v5 port by baizhu945)"
license = "MIT"
dependencies = []
tags = ["bar", "panel", "service", "productivity"]
icon = "clipboard-check"
description = "Multi-page tasks with details, drag reordering, copying, exports, and V4 migration."

[[setting]]
key = "show_completed"
type = "bool"
label_key = "settings.show_completed.label"
description_key = "settings.show_completed.description"
default = true

[[setting]]
key = "export_path"
type = "folder"
label_key = "settings.export_path.label"
description_key = "settings.export_path.description"
default = "~/Documents"

[[setting]]
key = "export_format"
type = "select"
label_key = "settings.export_format.label"
description_key = "settings.export_format.description"
default = "markdown"
options = [
  { value = "markdown", label_key = "settings.export_format.markdown" },
  { value = "json", label_key = "settings.export_format.json" },
]

[[setting]]
key = "export_empty_sections"
type = "bool"
label_key = "settings.export_empty_sections.label"
description_key = "settings.export_empty_sections.description"
default = false

[[setting]]
key = "use_custom_colors"
type = "bool"
label_key = "settings.use_custom_colors.label"
description_key = "settings.use_custom_colors.description"
default = false

[[setting]]
key = "priority_low_color"
type = "color"
label_key = "settings.priority_low_color.label"
description_key = "settings.priority_low_color.description"
default = "#9E9E9E"
visible_when = { key = "use_custom_colors", values = ["true"] }

[[setting]]
key = "priority_medium_color"
type = "color"
label_key = "settings.priority_medium_color.label"
description_key = "settings.priority_medium_color.description"
default = "#2196F3"
visible_when = { key = "use_custom_colors", values = ["true"] }

[[setting]]
key = "priority_high_color"
type = "color"
label_key = "settings.priority_high_color.label"
description_key = "settings.priority_high_color.description"
default = "#F44336"
visible_when = { key = "use_custom_colors", values = ["true"] }

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [widget.actions]
  left = "panel-toggle baizhu/paged-todo:panel"
  right = "settings-open-plugin baizhu/paged-todo"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 700
height = 500
placement = "attached"
position = "top_left"
