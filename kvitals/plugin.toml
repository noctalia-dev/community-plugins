# KVitals for Noctalia — live system vitals in the bar, panel, and desktop.
#
# A Luau port of the KVitals KDE Plasma widget (GPL-3.0).
# Upstream: https://github.com/yassine20011/kvitals
#
# Architecture: one headless [[service]] samples the host System Monitor,
# sysfs, and /proc, then publishes to the plugin state. The [[widget]],
# [[panel]], and [[desktop_widget]] are thin clients that watch that state.
#
# Settings are plugin-level ([[setting]] at the root): one set shared by
# every entry, edited from Settings -> Plugins, seeded into
# noctalia.getConfig everywhere. Per-instance presentation settings live
# under their entry.

id = "royalebiskut/kvitals"
name = "KVitals"
version = "0.1.0"
plugin_api = 22
author = "royalebiskut"
license = "GPL-3.0"
icon = "cpu"
description = "Live CPU, RAM, GPU, temperature, fan, battery, network, and disk vitals for the bar and desktop."
dependencies = ["cat", "ip"]
tags = ["system", "hardware", "bar", "panel", "desktop", "network", "indicator"]

# ── General ──────────────────────────────────────────────────────────────

[[setting]]
key = "refresh_ms"
type = "int"
min = 250
max = 10000
default = 1000
label_key = "settings.refresh_ms.label"
description_key = "settings.refresh_ms.description"

[[setting]]
key = "temp_unit"
type = "select"
default = "c"
label_key = "settings.temp_unit.label"
description_key = "settings.temp_unit.description"
options = [
  { value = "c", label_key = "settings.temp_unit.options.c" },
  { value = "f", label_key = "settings.temp_unit.options.f" },
]

[[setting]]
key = "net_unit"
type = "select"
default = "auto"
label_key = "settings.net_unit.label"
description_key = "settings.net_unit.description"
options = [
  { value = "auto", label_key = "settings.net_unit.options.auto" },
  { value = "kb", label_key = "settings.net_unit.options.kb" },
  { value = "mb", label_key = "settings.net_unit.options.mb" },
]

[[setting]]
key = "metric_order"
type = "string_list"
default = ["cpu", "ram", "temp", "gpu", "vram", "fan", "battery", "net", "disk"]
label_key = "settings.metric_order.label"
description_key = "settings.metric_order.description"

