# ── Entries ──────────────────────────────────────────────────────────────

[[service]]
id = "sampler"
entry = "service.luau"

[[widget]]
id = "metrics"
entry = "widget.luau"

  [[widget.setting]]
  key = "display_mode"
  type = "select"
  default = "both"
  label_key = "settings.display_mode.label"
  description_key = "settings.display_mode.description"
  options = [
    { value = "both", label_key = "settings.display_mode.options.both" },
    { value = "text", label_key = "settings.display_mode.options.text" },
    { value = "icons", label_key = "settings.display_mode.options.icons" },
  ]

  [[widget.setting]]
  key = "font_size"
  type = "int"
  min = 8
  max = 24
  default = 12
  label_key = "settings.font_size.label"
  description_key = "settings.font_size.description"

  [[widget.setting]]
  key = "hide_absent"
  type = "bool"
  default = true
  label_key = "settings.hide_absent.label"
  description_key = "settings.hide_absent.description"

[[panel]]
id = "sparkline"
entry = "panel.luau"
width = 560
height = 460
placement = "floating"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true

  [[panel.setting]]
  key = "show_graphs"
  type = "bool"
  default = true
  label_key = "settings.show_graphs.label"
  description_key = "settings.show_graphs.description"

  [[panel.setting]]
  key = "graph_height"
  type = "int"
  min = 32
  max = 160
  default = 64
  label_key = "settings.graph_height.label"
  description_key = "settings.graph_height.description"

[[desktop_widget]]
id = "tile"
entry = "desktop.luau"

  [[desktop_widget.setting]]
  key = "show_glyphs"
  type = "bool"
  default = true
  label_key = "settings.show_glyphs.label"
  description_key = "settings.show_glyphs.description"

  [[desktop_widget.setting]]
  key = "font_size"
  type = "int"
  min = 8
  max = 24
  default = 12
  label_key = "settings.font_size.label"
  description_key = "settings.font_size.description"
