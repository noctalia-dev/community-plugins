# Mihomo Control — monitor and control a Mihomo (Clash Meta) external
# controller: live traffic, proxy mode, group selection, latency tests and
# active connections, locally (127.0.0.1) or on a remote host.
#
# The service entry owns every HTTP request and publishes "mihomo.*" state;
# the widget, panel and shortcut are pure subscribers and send commands
# through the "mihomo.command" state channel.

id = "mdj2812/mihomo-control"
name = "Mihomo Control"
version = "0.1.2"
plugin_api = 9
author = "mdj2812"
license = "MIT"
icon = "cat"
description = "Monitor and control Mihomo (Clash Meta) — live traffic, proxy mode, group selection, and connections, local or remote."
tags = ["network", "indicator", "utility", "bar", "panel", "service", "shortcut"]
dependencies = []

# ── Shared settings ──────────────────────────────────────────────────────────
[[setting]]
key = "host"
type = "string"
default = "127.0.0.1"
label_key = "settings.host.label"
description_key = "settings.host.description"

[[setting]]
key = "port"
type = "string"
default = "9090"
label_key = "settings.port.label"
description_key = "settings.port.description"

[[setting]]
key = "secret"
type = "string"
default = ""
label_key = "settings.secret.label"
description_key = "settings.secret.description"

[[setting]]
key = "use_https"
type = "bool"
default = false
advanced = true
label_key = "settings.use_https.label"
description_key = "settings.use_https.description"

[[setting]]
key = "allow_insecure_tls"
type = "bool"
default = false
advanced = true
label_key = "settings.allow_insecure_tls.label"
description_key = "settings.allow_insecure_tls.description"

[[setting]]
key = "test_url"
type = "string"
default = "https://www.gstatic.com/generate_204"
label_key = "settings.test_url.label"
description_key = "settings.test_url.description"

[[setting]]
key = "refresh_interval"
type = "int"
default = 2
min = 1
max = 60
advanced = true
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"

[[setting]]
key = "panel_placement"
type = "select"
default = "floating"
label_key = "settings.panel_placement.label"
description_key = "settings.panel_placement.description"
options = [
  { value = "floating", label_key = "settings.panel_placement.options.floating" },
  { value = "attached", label_key = "settings.panel_placement.options.attached" },
]

# ── Entries ──────────────────────────────────────────────────────────────────
[[widget]]
id = "widget"
entry = "widget.luau"

  [[widget.setting]]
  key = "label_content"
  type = "select"
  default = "mode"
  label_key = "settings.label_content.label"
  description_key = "settings.label_content.description"
  options = [
    { value = "none", label_key = "settings.label_content.options.none" },
    { value = "mode", label_key = "settings.label_content.options.mode" },
    { value = "download", label_key = "settings.label_content.options.download" },
    { value = "upload", label_key = "settings.label_content.options.upload" },
    { value = "traffic", label_key = "settings.label_content.options.traffic" },
    { value = "connections", label_key = "settings.label_content.options.connections" },
    { value = "proxy", label_key = "settings.label_content.options.proxy" },
    { value = "latency", label_key = "settings.label_content.options.latency" },
  ]

  [[widget.setting]]
  key = "icon_size"
  type = "int"
  default = 16
  min = 10
  max = 32
  label_key = "settings.icon_size.label"
  description_key = "settings.icon_size.description"

  [[widget.setting]]
  key = "icon_color_mode"
  type = "select"
  default = "status"
  label_key = "settings.icon_color_mode.label"
  description_key = "settings.icon_color_mode.description"
  options = [
    { value = "status", label_key = "settings.icon_color_mode.options.status" },
    { value = "custom", label_key = "settings.icon_color_mode.options.custom" },
  ]

  [[widget.setting]]
  key = "icon_color"
  type = "color"
  default = "primary"
  label_key = "settings.icon_color.label"
  description_key = "settings.icon_color.description"
  visible_when = { key = "icon_color_mode", values = ["custom"] }

# Panel placement is host-owned, so the widget selects between two entries
# backed by the same script according to the panel_placement setting.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = 720
placement = "floating"
position = "center"

[[panel]]
id = "panel-attached"
entry = "panel.luau"
width = 560
height = 720
placement = "attached"
position = "auto"
open_near_click = true

[[service]]
id = "service"
entry = "service.luau"

[[shortcut]]
id = "mode"
entry = "shortcut.luau"
