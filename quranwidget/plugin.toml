id = "mezoahmedii/quranwidget"
name = "Quran Widget"
description = "A Noctalia widget to show a random Quranic Ayah/verse on the desktop"
version = "1.0.0"
plugin_api = 3
author = "MezoAhmedII"
icon = "book"
tags = ["desktop", "utility"]

[[desktop_widget]]
id = "quranwidget"
entry = "widget.luau"

[[desktop_widget.setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 30

[[desktop_widget.setting]]
key = "show_translation"
type = "bool"
label_key = "settings.show_translation.label"
description_key = "settings.show_translation.description"
default = true

[[desktop_widget.setting]]
key = "translation_edition"
