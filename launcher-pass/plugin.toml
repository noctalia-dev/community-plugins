# launcher-pass — Noctalia v5 launcher provider for the GNU Pass store.
# Port of the QML v4 plugin to Luau (see CLAUDE.md).
#
# plugin_api = 26: the highest-level feature currently used is
# noctalia.getSetting (lands at level 26), read to find the launcher's
# configured leader character (shell.launcher.provider_prefix) for the
# pinentry-dance panel reopen. Bump this only when a later port step pulls in
# something newer.

id = "mellotanica/launcher-pass"
name = "Launcher pass"
version = "2.0.0"
plugin_api = 26
author = "Marco Melletti"
license = "MIT"
icon = "lock"
description = "Noctalia launcher provider for the GNU Pass password store with autotype and advanced search"
tags = ["Launcher"]
dependencies = ["pass", "find", "grep"]

# Settings are declared plugin-wide ([[setting]], the form the sibling launcher
# plugins use) rather than nested under [[launcher_provider.setting]]; this plugin
# only ships a launcher provider, so the two are equivalent here. Read back with
# noctalia.getConfig("storePath") etc.

[[setting]]
key = "storePath"
type = "folder"
label_key = "settings.storePath.label"
description_key = "settings.storePath.desc"
default = ""

[[setting]]
key = "clipTimeout"
type = "string"                     # kept a string so "" means "fall back to env"
label_key = "settings.clipTimeout.label"
description_key = "settings.clipTimeout.desc"
default = ""

[[setting]]
key = "typeDelay"
type = "int"
label_key = "settings.typeDelay.label"
description_key = "settings.typeDelay.desc"
default = 500                       # milliseconds (label is historically misleading)
min = 0
advanced = true

[[setting]]
key = "wtypeDelay"
type = "int"
label_key = "settings.wtypeDelay.label"
description_key = "settings.wtypeDelay.desc"
default = 12                        # milliseconds between keystrokes
min = 0
advanced = true

[[setting]]
key = "pinentryGraceMs"
type = "int"
label_key = "settings.pinentryGraceMs.label"
description_key = "settings.pinentryGraceMs.desc"
default = 500                       # milliseconds; see pinentryGraceMs() in launcher.luau
min = 0
advanced = true

[[launcher_provider]]
id = "pass"
entry = "launcher.luau"
prefix = "pass"                     # user types ">pass " (Noctalia adds the ">")
glyph = "lock"
include_in_global_search = false
