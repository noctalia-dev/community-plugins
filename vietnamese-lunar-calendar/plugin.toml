id = "notoxus/vietnamese-lunar-calendar"
name = "Vietnamese Lunar Calendar"
version = "1.1.2"
plugin_api = 43
author = "notoxus"
license = "MIT"
dependencies = []
tags = ["panel", "shortcut", "bar", "desktop", "time", "utility"]
icon = "moon-stars"
description = "Vietnamese lunar calendar with lunar dates, Can Chi and traditional festivals."

[[setting]]
key = "show_festivals"
type = "bool"
label_key = "settings.show_festivals.label"
description_key = "settings.show_festivals.description"
default = true

[[setting]]
key = "show_can_chi"
type = "bool"
label_key = "settings.show_can_chi.label"
description_key = "settings.show_can_chi.description"
default = true
advanced = true

[[setting]]
key = "accent_weekends"
type = "bool"
label_key = "settings.accent_weekends.label"
description_key = "settings.accent_weekends.description"
default = true
advanced = true

[[setting]]
key = "show_timezone"
type = "bool"
label_key = "settings.show_timezone.label"
description_key = "settings.show_timezone.description"
default = true
advanced = true

[[setting]]
key = "font_scale"
type = "double"
label_key = "settings.font_scale.label"
description_key = "settings.font_scale.description"
default = 1.2
min = 0.8
max = 2.0

[[setting]]
key = "max_events"
type = "int"
label_key = "settings.max_events.label"
description_key = "settings.max_events.description"
default = 4
min = 1
max = 10

[[widget]]
id = "lunar"
entry = "upcoming.luau"

[[desktop_widget]]
id = "calendar-desktop"
entry = "desktop.luau"

[[shortcut]]
id = "calendar-shortcut"
entry = "shortcut.luau"

[[panel]]
id = "calendar"
entry = "panel.luau"
width = 600
height = 580
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
