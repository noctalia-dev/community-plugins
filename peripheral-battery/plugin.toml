id = "nemanja/peripheral-battery"
name = "Peripheral Battery"
version = "0.1.0"
plugin_api = 9
author = "nemanja"
license = "MIT"
icon = "mouse"
description = "Monitor battery levels of wireless peripherals (mice, keyboards, headsets, controllers, and other devices) via UPower."
tags = ["battery", "hardware", "peripheral", "utility", "system"]
dependencies = ["upower"]

[[setting]]
key = "refresh_seconds"
type = "int"
label_key = "settings.refresh_seconds.label"
description_key = "settings.refresh_seconds.description"
default = 60
min = 10
max = 3600

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 440
placement = "attached"
position = "auto"
