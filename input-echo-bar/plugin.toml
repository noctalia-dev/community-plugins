id = "baizhu/input-echo-bar"
name = "Input Echo Bar"
version = "1.0.0"
plugin_api = 3
author = "baizhu945"
license = "MIT"
dependencies = ["showmethekey-cli", "python3"]
tags = ["bar", "indicator", "privacy", "utility"]
icon = "keyboard"
description = "Briefly shows the latest keyboard or mouse combination directly in the Noctalia bar."

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "timeout_ms"
  type = "int"
  label_key = "settings.timeout_ms.label"
  description_key = "settings.timeout_ms.description"
  default = 2000
  min = 250
  max = 10000
  step = 250

  [[widget.setting]]
  key = "show_mouse_events"
  type = "bool"
  label_key = "settings.show_mouse_events.label"
  description_key = "settings.show_mouse_events.description"
  default = true
