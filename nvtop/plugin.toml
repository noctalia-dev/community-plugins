id = "tordex/nvtop"
name = "NVTOP"
version = "1.0.0"
plugin_api = 20
author = "tordex"
license = "MIT"
dependencies = ["nvtop", "jq", "pkill"]
tags = ["panel", "system"]
icon = "cpu"
description = "Monitor real-time information about your GPU status and running processes with nvtop."

[[setting]]
key = "delay"
type = "int"
label_key = "settings.delay.label"
description_key = "settings.delay.description"
default = 5
min = 1
max = 20

[[setting]]
key = "sort_column_background"
type = "color"
label_key = "settings.sort_column_background.label"
description_key = "settings.sort_column_background.description"
default = "secondary"

[[setting]]
key = "sort_column_color"
type = "color"
label_key = "settings.sort_column_color.label"
description_key = "settings.sort_column_color.description"
default = "on_secondary"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 750
height = 600
placement = "attached"
open_near_click = true
