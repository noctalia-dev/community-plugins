id = "viksit-garg/wayvibes"
name = "WayVibes"
version = "1.0.1"
plugin_api = 43
author = "viksit-garg"
license = "MIT"
icon = "keyboard"
description = "Mechanical keyboard typing sounds for Noctalia on Wayland, powered by wayvibes."
tags = ["audio", "bar", "panel", "utility"]
dependencies = ["wayvibes", "pkill", "pgrep", "sleep"]

[[widget]]
id = "wayvibes"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "keyboard"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 540
height = 640
placement = "floating"
position = "auto"
open_near_click = true

[[service]]
id = "daemon"
entry = "service.luau"

[[setting]]
key = "executable_path"
type = "string"
label_key = "settings.executable_path.label"
description_key = "settings.executable_path.description"
default = "wayvibes"

[[setting]]
key = "soundpacks_dir"
type = "folder"
label_key = "settings.soundpacks_dir.label"
description_key = "settings.soundpacks_dir.description"
default = ""

[[setting]]
key = "default_volume"
type = "int"
label_key = "settings.default_volume.label"
description_key = "settings.default_volume.description"
default = 3
min = 1
max = 10

[[setting]]
key = "auto_start"
type = "bool"
label_key = "settings.auto_start.label"
description_key = "settings.auto_start.description"
default = false
