id = "soul/palettes"
name = "Palettes"
version = "1.0.1"
plugin_api = 43
author = "soul"
license = "MIT"
dependencies = []
tags = ["development", "panel", "theming", "utility"]
icon = "palette"
description = "Create, manage and copy colors from local palettes or builtin picks from the community."

[[widget]]
id = "bar"
entry = "bar.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 800
height = 700
placement = "floating"
position = "center"

  [[panel.setting]]
  key = "columns"
  type = "int"
  label_key = "settings.columns.label"
  description_key = "settings.columns.description"
  default = 3
  min = 1
  max = 3

  [[panel.setting]]
  key = "show_builtin"
  type = "bool"
  label_key = "settings.show_builtin.label"
  description_key = "settings.show_builtin.description"
  default = true