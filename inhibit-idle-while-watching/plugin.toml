name = "Inhibit Idle While Watching"
id = "zhangdm/inhibit-idle-while-watching"
description = "Checks for a face when idle is about to act and restarts the idle countdown while you keep watching."
version = "0.2.0"
author = "zhangdm"
license = "MIT"
icon = "camera"
plugin_api = 24
tags = ["service", "hardware", "privacy", "system", "utility"]
dependencies = ["noctalia", "python3", "ffmpeg", "v4l2-ctl", "wtype"]

[[setting]]
key = "enabled"
type = "bool"
label_key = "settings.enabled.label"
description_key = "settings.enabled.description"
default = true

[[setting]]
key = "camera_path"
type = "string"
label_key = "settings.camera_path.label"
description_key = "settings.camera_path.description"
default = ""

[[setting]]
key = "detector"
type = "string"
label_key = "settings.detector.label"
description_key = "settings.detector.description"
default = "haar"

[[setting]]
key = "sensitivity"
type = "int"
label_key = "settings.sensitivity.label"
description_key = "settings.sensitivity.description"
default = 5
min = 1
max = 10
step = 1

[[setting]]
key = "capture_width"
type = "int"
label_key = "settings.capture_width.label"
description_key = "settings.capture_width.description"
default = 640
min = 320
max = 1280
step = 160

[[setting]]
key = "cooldown_s"
type = "int"
label_key = "settings.cooldown_s.label"
description_key = "settings.cooldown_s.description"
default = 10
min = 0
max = 300
step = 1

[[setting]]
key = "debug_log"
type = "bool"
label_key = "settings.debug_log.label"
description_key = "settings.debug_log.description"
default = false

[[service]]
id = "face-watch"
entry = "service.luau"
