id = "faented/opencode-monitor"
name = "OpenCode Monitor"
version = "0.3.1"
plugin_api = 43
author = "faented"
license = "MIT"
icon = "robot"
tags = ["ai", "development", "bar", "panel", "service"]
description = "Read-only live view of local OpenCode sessions: activity, waits, queued prompts, costs, and recent sessions."
dependencies = []

# Polling and history are shared by the service, widget and panel.
[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 2
min = 1
max = 15

[[setting]]
key = "recent_minutes"
type = "int"
label_key = "settings.recent_minutes.label"
description_key = "settings.recent_minutes.description"
default = 120
min = 1
max = 1440

[[setting]]
key = "recent_count"
type = "int"
label_key = "settings.recent_count.label"
description_key = "settings.recent_count.description"
default = 8
min = 1
max = 30

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 720
height = 740
placement = "attached"
open_near_click = true
dismiss_on_outside_click = true
capture_keys = ["Escape"]

[[widget]]
id = "widget"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle faented/opencode-monitor:panel"

  [[widget.setting]]
  key = "display_mode"
  type = "select"
  label_key = "settings.display_mode.label"
  description_key = "settings.display_mode.description"
  default = "activity"
  options = [
    { value = "activity", label_key = "settings.display_mode.options.activity" },
    { value = "counts", label_key = "settings.display_mode.options.counts" },
    { value = "dots", label_key = "settings.display_mode.options.dots" },
  ]

  [[widget.setting]]
  key = "show_label"
  type = "bool"
  label_key = "settings.show_label.label"
  description_key = "settings.show_label.description"
  default = true

  [[widget.setting]]
  key = "label_width"
  type = "int"
  label_key = "settings.label_width.label"
  description_key = "settings.label_width.description"
  default = 26
  min = 8
  max = 60

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "robot"

  [[widget.setting]]
  key = "show_children"
  type = "bool"
  label_key = "settings.show_children.label"
  description_key = "settings.show_children.description"
  default = true
