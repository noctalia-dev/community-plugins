# What Did I Do — a local-first, privacy-first desktop activity tracker for Noctalia.
#
# plugin_api is chosen as the lowest level that provides every capability used:
#   API  9: function closures in declarative ui.* callbacks
#   API 12: noctalia.nowMs() for sub-second clocks
#   API 17: service onExit(signal, reason) lifecycle handling
#   API 22: require("./path.luau") for shared modules
#   API 24: argument-array noctalia.runAsync() (no shell parsing for any input)
id = "alitura1/what-did-i-do"
name = "What Did I Do"
version = "0.1.0"
plugin_api = 24
author = "alitura1"
license = "MIT"
icon = "clock-hour-4"
description = "Local-first activity tracker: see which apps used your day, with a bar widget, dashboard panel and /activity launcher."
dependencies = ["hyprctl", "hypridle", "dbus-monitor"]
tags = ["privacy", "productivity", "bar", "panel", "launcher"]

# ── Global settings ──────────────────────────────────────────────────────────

[[setting]]
key = "tracking_enabled"
type = "bool"
label_key = "settings.tracking_enabled.label"
description_key = "settings.tracking_enabled.description"
default = true

[[setting]]
key = "track_window_titles"
type = "bool"
label_key = "settings.track_window_titles.label"
description_key = "settings.track_window_titles.description"
default = false

[[setting]]
key = "history_retention_days"
type = "int"
label_key = "settings.history_retention_days.label"
description_key = "settings.history_retention_days.description"
default = 30
min = 1
max = 3650

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 2
min = 1
max = 60

[[setting]]
key = "idle_after_seconds"
type = "int"
label_key = "settings.idle_after_seconds.label"
description_key = "settings.idle_after_seconds.description"
default = 120
min = 10
max = 600

[[setting]]
key = "persist_every_seconds"
type = "int"
label_key = "settings.persist_every_seconds.label"
description_key = "settings.persist_every_seconds.description"
default = 30
min = 5
max = 600

[[setting]]
key = "show_bar_widget"
type = "bool"
label_key = "settings.show_bar_widget.label"
description_key = "settings.show_bar_widget.description"
default = true

# ── Entries ──────────────────────────────────────────────────────────────────

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "widget.luau"

[[desktop_widget]]
id = "summary"
entry = "desktop_widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "clock-hour-4"

  [[widget.setting]]
  key = "show_text"
  type = "bool"
  label_key = "settings.show_text.label"
  description_key = "settings.show_text.description"
  default = true

  [[widget.setting]]
  key = "show_glyph"
  type = "bool"
  label_key = "settings.show_glyph.label"
  description_key = "settings.show_glyph.description"
  default = true

[[panel]]
id = "dashboard"
entry = "panel.luau"
width = 420
height = 700
placement = "attached"
position = "auto"
open_near_click = true

[[launcher_provider]]
id = "activity"
entry = "launcher.luau"
prefix = "activity"
glyph = "clock-hour-4"
include_in_global_search = false

[[shortcut]]
id = "toggle"
entry = "shortcut.luau"
