id = "miguelfm/ai-triage"
name = "AI Triage"
version = "1.6.3"
plugin_api = 43
author = "miguelfm"
license = "MIT"
icon = "scale"
description = "AI quota triage, smart model routing and rolling window kickstarting."
tags = ["bar", "panel", "ai", "indicator", "utility"]
# The CLI owns credentials, vendor endpoints and caching. This plugin only runs
# `ai-usagebar usage --json` and draws the result.
# Optional backend CLIs for `bin/ai-kickstart`: `claude`, `codex`, `agy`.
# Note: ai-usagebar must query production `cloudcode-pa.googleapis.com` to report
# Antigravity's Gemini quota buckets alongside Claude & GPT OSS.
dependencies = ["ai-usagebar", "xdg-open"]

# ── Plugin-level settings (shared by the poller, every capsule and the panel) ──

# No path setting: `ai-usagebar` is a declared dependency, so it is on PATH.

[[setting]]
key = "refresh_minutes"
type = "int"
label_key = "settings.refresh_minutes.label"
description_key = "settings.refresh_minutes.description"
default = 5
min = 1
max = 120
step = 1

[[setting]]
key = "font_scale"
type = "select"
label_key = "settings.font_scale.label"
description_key = "settings.font_scale.description"
default = "normal"
options = [
  { value = "compact", label_key = "settings.font_scale.option.compact" },
  { value = "normal", label_key = "settings.font_scale.option.normal" },
  { value = "large", label_key = "settings.font_scale.option.large" },
  { value = "huge", label_key = "settings.font_scale.option.huge" },
]

[[setting]]
key = "schedule_aware_triage"
type = "bool"
label_key = "settings.schedule_aware_triage.label"
description_key = "settings.schedule_aware_triage.description"
default = true

[[setting]]
key = "sleep_start_hour"
type = "int"
label_key = "settings.sleep_start_hour.label"
description_key = "settings.sleep_start_hour.description"
default = 0
min = 0
max = 23
step = 1
visible_when = { key = "schedule_aware_triage", values = ["true"] }

[[setting]]
key = "sleep_end_hour"
type = "int"
label_key = "settings.sleep_end_hour.label"
description_key = "settings.sleep_end_hour.description"
default = 8
min = 0
max = 23
step = 1
visible_when = { key = "schedule_aware_triage", values = ["true"] }

[[setting]]
key = "weekend_sleep_start_hour"
type = "int"
label_key = "settings.weekend_sleep_start_hour.label"
description_key = "settings.weekend_sleep_start_hour.description"
default = 1
min = 0
max = 23
step = 1
visible_when = { key = "schedule_aware_triage", values = ["true"] }

[[setting]]
key = "weekend_sleep_end_hour"
type = "int"
label_key = "settings.weekend_sleep_end_hour.label"
description_key = "settings.weekend_sleep_end_hour.description"
default = 9
min = 0
max = 23
step = 1
visible_when = { key = "schedule_aware_triage", values = ["true"] }

[[setting]]
key = "meal_pause_hours"
type = "int"
label_key = "settings.meal_pause_hours.label"
description_key = "settings.meal_pause_hours.description"
default = 1
min = 0
max = 3
step = 1
visible_when = { key = "schedule_aware_triage", values = ["true"] }

# Service & model filtering: Allows hiding specific models or providers.

[[setting]]
key = "hide_claude_oss"
type = "bool"
label_key = "settings.hide_claude_oss.label"
description_key = "settings.hide_claude_oss.description"
default = false

[[setting]]
key = "hidden_services"
type = "string"
label_key = "settings.hidden_services.label"
description_key = "settings.hidden_services.description"
default = ""
advanced = true

# Gearing ratios: Decimal numbers (sessions per weekly quota).
# Automatically calibrated at runtime from usage telemetry unless customized here.
# Flagged advanced to keep standard settings concise.

[[setting]]
key = "gearing_claude_oss"
type = "double"
label_key = "settings.gearing_claude_oss.label"
description_key = "settings.gearing_claude_oss.description"
default = 2.5
min = 0.5
max = 30.0
step = 0.1
advanced = true

[[setting]]
key = "gearing_gemini"
type = "double"
label_key = "settings.gearing_gemini.label"
description_key = "settings.gearing_gemini.description"
default = 8.0
min = 0.5
max = 30.0
step = 0.1
advanced = true

[[setting]]
key = "gearing_anthropic"
type = "double"
label_key = "settings.gearing_anthropic.label"
description_key = "settings.gearing_anthropic.description"
default = 7.0
min = 0.5
max = 30.0
step = 0.1
advanced = true

[[setting]]
key = "gearing_openai"
type = "double"
label_key = "settings.gearing_openai.label"
description_key = "settings.gearing_openai.description"
default = 6.3
min = 0.5
max = 30.0
step = 0.1
advanced = true

[[setting]]
key = "gearing_default"
type = "double"
label_key = "settings.gearing_default.label"
description_key = "settings.gearing_default.description"
default = 10.0
min = 0.5
max = 30.0
step = 0.1
advanced = true

# ── Entries ───────────────────────────────────────────────────────────────────

# One poller for the whole shell: a single `usage --json` call returns every
# vendor, so N capsules on M monitors still cost one process per cycle.
[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

# Right click asks the poller for a read. Declared rather than handled in
# bar.luau because a binding is what the settings editor lists and what a user
# can point somewhere else; an onRightClick callback is neither.
#
# Left stays in the script: it sets `selected` before opening the panel, so the
# panel lands on the provider this capsule tracks, which `panel-toggle` alone
# cannot do.
  [widget.actions]
  right = "plugin miguelfm/ai-triage:poller all refresh"

# Per-instance, so a second capsule can track a second provider.
[[widget.setting]]
key = "vendor"
type = "select"
label_key = "settings.vendor.label"
description_key = "settings.vendor.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.vendor.option.auto" },
  { value = "anthropic", label_key = "settings.vendor.option.anthropic" },
  { value = "openai", label_key = "settings.vendor.option.openai" },
  { value = "anthropic_api", label_key = "settings.vendor.option.anthropic_api" },
  { value = "zai", label_key = "settings.vendor.option.zai" },
  { value = "openrouter", label_key = "settings.vendor.option.openrouter" },
  { value = "deepseek", label_key = "settings.vendor.option.deepseek" },
  { value = "kimi", label_key = "settings.vendor.option.kimi" },
  { value = "kilo", label_key = "settings.vendor.option.kilo" },
  { value = "novita", label_key = "settings.vendor.option.novita" },
  { value = "moonshot", label_key = "settings.vendor.option.moonshot" },
  { value = "grok", label_key = "settings.vendor.option.grok" },
  { value = "supergrok", label_key = "settings.vendor.option.supergrok" },
  { value = "antigravity", label_key = "settings.vendor.option.antigravity" },
  { value = "gemini", label_key = "settings.vendor.option.gemini" },
  { value = "claude-oss", label_key = "settings.vendor.option.claude_oss" },
  { value = "cursor", label_key = "settings.vendor.option.cursor" },
  { value = "minimax", label_key = "settings.vendor.option.minimax" },
  { value = "kiro", label_key = "settings.vendor.option.kiro" },
  { value = "nous", label_key = "settings.vendor.option.nous" },
  { value = "opencode-go", label_key = "settings.vendor.option.opencode_go" },
  { value = "commandcode", label_key = "settings.vendor.option.commandcode" },
  { value = "copilot", label_key = "settings.vendor.option.copilot" },
]

# One capsule can carry more than one provider; "auto" fills it with the busiest.
# Visible only when vendor is auto because pinned providers show exactly themselves.
[[widget.setting]]
key = "provider_limit"
type = "int"
label_key = "settings.provider_limit.label"
description_key = "settings.provider_limit.description"
default = 1
min = 1
max = 4
step = 1
visible_when = { key = "vendor", values = ["auto"] }

# Named CLI accounts use stable `<provider>@<label>` entry ids.
# Kept in advanced so single-account users have a clean settings view.
[[widget.setting]]
key = "account"
type = "string"
label_key = "settings.account.label"
description_key = "settings.account.description"
default = ""
advanced = true

# Keys named after the core `sysmon` widget, so the CPU capsule and this one are
# configured with the same vocabulary.
[[widget.setting]]
key = "visualization"
type = "select"
label_key = "settings.visualization.label"
description_key = "settings.visualization.description"
default = "gauge"
options = [
  { value = "none", label_key = "settings.visualization.option.none" },
  { value = "gauge", label_key = "settings.visualization.option.gauge" },
]

[[widget.setting]]
key = "color_by_usage"
type = "bool"
label_key = "settings.color_by_usage.label"
description_key = "settings.color_by_usage.description"
default = true

[[widget.setting]]
key = "show_value"
type = "bool"
label_key = "settings.show_value.label"
description_key = "settings.show_value.description"
default = true

[[widget.setting]]
key = "show_name"
type = "bool"
label_key = "settings.show_name.label"
description_key = "settings.show_name.description"
default = false

[[widget.setting]]
key = "show_glyph"
type = "bool"
label_key = "settings.show_glyph.label"
description_key = "settings.show_glyph.description"
default = true

[[widget.setting]]
key = "glyph_position"
type = "select"
label_key = "settings.glyph_position.label"
description_key = "settings.glyph_position.description"
default = "before"
options = [
  { value = "before", label_key = "settings.glyph_position.option.before" },
  { value = "after", label_key = "settings.glyph_position.option.after" },
]
visible_when = { key = "show_glyph", values = ["true"] }

[[widget.setting]]
key = "extras"
type = "select"
label_key = "settings.extras.label"
description_key = "settings.extras.description"
default = "countdown"
options = [
  { value = "countdown", label_key = "settings.extras.option.countdown" },
  { value = "pace", label_key = "settings.extras.option.pace" },
  { value = "both", label_key = "settings.extras.option.both" },
  { value = "none", label_key = "settings.extras.option.none" },
]

[[widget.setting]]
key = "bar_font_scale"
type = "select"
label_key = "settings.bar_font_scale.label"
description_key = "settings.bar_font_scale.description"
default = "inherit"
options = [
  { value = "inherit", label_key = "settings.font_scale.option.inherit" },
  { value = "compact", label_key = "settings.font_scale.option.compact" },
  { value = "normal", label_key = "settings.font_scale.option.normal" },
  { value = "large", label_key = "settings.font_scale.option.large" },
  { value = "huge", label_key = "settings.font_scale.option.huge" },
]

[[panel]]
id = "panel"
entry = "panel.luau"
# Provider tabs at the top, detailed charts and accessory cards below.
# Scaled to 780px to accommodate all cards comfortably under huge typography presets.
width = 1520
height = 780
# The shell draws the Placement and Position rows for every plugin panel whether
# or not they are declared; declaring them only picks the default the user gets.
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
capture_keys = ["escape", "r", "up", "down", "left", "right"]
