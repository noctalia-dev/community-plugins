id = "blackbartblues/audio-switcher"
name = "Audio Switcher"
version = "0.6.3"
plugin_api = 43
author = "blackbartblues"
license = "MIT"
deprecated = true
icon = "switch-horizontal"
description = "Switch audio inputs and outputs, hand off Bluetooth devices, and control them from compositor keybinds."
tags = ["audio", "bar", "hardware", "launcher", "panel", "service", "system", "utility"]
dependencies = ["pactl", "bluetoothctl", "sleep"]

[[setting]]
key = "show_percentage"
type = "bool"
label_key = "settings.show_percentage.label"
description_key = "settings.show_percentage.description"
default = true

[[setting]]
key = "show_notification_on_switch"
type = "bool"
label_key = "settings.show_notification_on_switch.label"
description_key = "settings.show_notification_on_switch.description"
default = true

[[setting]]
key = "show_actions_in_tooltip"
type = "bool"
label_key = "settings.show_actions_in_tooltip.label"
description_key = "settings.show_actions_in_tooltip.description"
default = true

[[setting]]
key = "refresh_interval_seconds"
type = "int"
label_key = "settings.refresh_interval_seconds.label"
description_key = "settings.refresh_interval_seconds.description"
default = 60
min = 10
max = 600
step = 10

[[setting]]
key = "panel_refresh_interval_seconds"
type = "int"
label_key = "settings.panel_refresh_interval_seconds.label"
description_key = "settings.panel_refresh_interval_seconds.description"
default = 5
min = 1
max = 60
step = 1

[[widget]]
id = "widget"
entry = "widget.luau"

  [widget.actions]
  scroll_up = "volume-up"
  scroll_down = "volume-down"
  left = "panel-toggle blackbartblues/audio-switcher:audio-switcher"
  right = "plugin blackbartblues/audio-switcher:service all cycle-output"
  middle = "plugin blackbartblues/audio-switcher:service all cycle-input"

[[panel]]
id = "audio-switcher"
entry = "panel.luau"
width = 620
height = 650
placement = "attached"
position = "top_right"
open_near_click = true

[[launcher_provider]]
id = "launcher"
entry = "launcher.luau"
prefix = "audio"
glyph = "switch-horizontal"
include_in_global_search = true

[[service]]
id = "service"
entry = "service.luau"
