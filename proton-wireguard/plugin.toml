id           = "gitgxldf1sh/proton-wireguard"
name         = "Proton VPN + WireGuard"
version      = "0.2.0"
plugin_api   = 43
author       = "gitgxldf1sh"
license      = "MIT"
icon         = "shield-lock"
description  = "Toggle Proton VPN and NetworkManager WireGuard tunnels from the bar. Control only: setup stays in the CLI."
tags         = ["bar", "panel", "service", "shortcut", "network", "privacy"]
dependencies = ["proton-vpn-cli", "nmcli", "getent", "bash", "pkill"]

[[setting]]
key             = "favorite_countries"
type            = "string_list"
label_key       = "settings.favorite_countries.label"
description_key = "settings.favorite_countries.description"
default         = ["CH", "NL", "US"]

[[setting]]
key             = "quick_connect"
type            = "select"
label_key       = "settings.quick_connect.label"
description_key = "settings.quick_connect.description"
default         = "fastest"
options         = [
  { value = "fastest", label_key = "settings.quick_connect.options.fastest" },
  { value = "last", label_key = "settings.quick_connect.options.last" },
]

[[setting]]
key             = "hidden_connections"
type            = "string_list"
label_key       = "settings.hidden_connections.label"
description_key = "settings.hidden_connections.description"
default         = []

[[setting]]
key             = "dns_check_host"
type            = "string"
label_key       = "settings.dns_check_host.label"
description_key = "settings.dns_check_host.description"
default         = ""

[[setting]]
key             = "show_server"
type            = "bool"
label_key       = "settings.show_server.label"
description_key = "settings.show_server.description"
default         = false

[[setting]]
key             = "notify"
type            = "bool"
label_key       = "settings.notify.label"
description_key = "settings.notify.description"
default         = true

[[service]]
id    = "service"
entry = "service.luau"

[[widget]]
id    = "bar"
entry = "bar.luau"

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 420
height          = "content"
max_height      = 760
placement       = "attached"
position        = "auto"
open_near_click = true

[[shortcut]]
id    = "proton"
entry = "shortcut.luau"
