# Timezone Hub — compare your device timezone against other cities and
# change your device timezone, from the bar and a panel.

id          = "ahmedhossamdev/timezone-hub"
name        = "Timezone Hub"
version     = "2.1.0"
plugin_api  = 24
author      = "ahmedhossamdev"
license     = "MIT"
icon        = "world"
description = "Change your device timezone and compare it against other cities, with live times and an hour-offset strip for each."
tags        = ["bar", "clock", "time", "utility"]
dependencies = ["timedatectl", "pkexec"]

[[widget]]
id    = "bar"
entry = "bar.luau"

[[panel]]
id             = "panel"
entry          = "panel.luau"
width          = 660
height         = 560
placement      = "attached"
position       = "auto"
open_near_click = true

[[service]]
id    = "service"
entry = "service.luau"

[[setting]]
key         = "time_format"
type        = "select"
label_key   = "settings.time-format"
default     = "24h"
options     = [
  { value = "24h", label_key = "settings.format-24h" },
  { value = "12h", label_key = "settings.format-12h" },
]

[[setting]]
key             = "show_date_in_bar"
type            = "bool"
label_key       = "settings.show-date-in-bar"
description_key = "settings.show-date-in-bar-desc"
default         = true

[[setting]]
key             = "show_date_in_panel"
type            = "bool"
label_key       = "settings.show-date-in-panel"
description_key = "settings.show-date-in-panel-desc"
default         = true

[[setting]]
key             = "show_relative_time"
type            = "bool"
label_key       = "settings.show-relative-time"
description_key = "settings.show-relative-time-desc"
default         = true

[[setting]]
key             = "show_sun_times"
type            = "bool"
label_key       = "settings.show-sun-times"
description_key = "settings.show-sun-times-desc"
default         = false

[[setting]]
key             = "date_format"
type            = "select"
label_key       = "settings.date-format"
default         = "weekday"
options         = [
  { value = "weekday", label_key = "settings.date-format-weekday" },
  { value = "short",   label_key = "settings.date-format-short" },
  { value = "iso",     label_key = "settings.date-format-iso" },
]

[[setting]]
key         = "hours_before"
type        = "int"
label_key   = "settings.hours-before"
default     = 2
min         = 0
max         = 6

[[setting]]
key         = "hours_after"
type        = "int"
label_key   = "settings.hours-after"
default     = 9
min         = 3
max         = 16

[[setting]]
key         = "highlight_work_hours"
type        = "bool"
label_key   = "settings.highlight-work-hours"
default     = true

[[setting]]
key         = "work_hour_start"
type        = "int"
label_key   = "settings.work-hours-range"
description_key = "settings.work-hour-start-desc"
default     = 9
min         = 0
max         = 23
visible_when = { key = "highlight_work_hours", values = ["true"] }

[[setting]]
key         = "work_hour_end"
type        = "int"
label_key   = "settings.work-hours-range"
description_key = "settings.work-hour-end-desc"
default     = 17
min         = 1
max         = 24
visible_when = { key = "highlight_work_hours", values = ["true"] }
