id          = "srounce/systemd"
name        = "Systemd Units"
version     = "1.0.0"
plugin_api  = 24
author      = "srounce"
license     = "MIT"
icon        = "settings-automation"
description = "Fuzzy-find systemd user and system units from the launcher and start, stop or restart them."
tags        = ["launcher", "system", "utility"]
dependencies = ["systemctl"]

[[setting]]
key       = "scopes"
type      = "select"
label_key = "settings.scopes.label"
description_key = "settings.scopes.description"
default   = "both"
options = [
  { value = "both",   label_key = "settings.scopes.options.both" },
  { value = "user",   label_key = "settings.scopes.options.user" },
  { value = "system", label_key = "settings.scopes.options.system" },
]

[[setting]]
key       = "unit_types"
type      = "string_list"
label_key = "settings.unit_types.label"
description_key = "settings.unit_types.description"
default   = ["service"]

[[setting]]
key       = "system_wrapper"
type      = "string"
label_key = "settings.system_wrapper.label"
description_key = "settings.system_wrapper.description"
default   = ""
advanced  = true

[[launcher_provider]]
id     = "units"
entry  = "launcher.luau"
prefix = "svc"
glyph  = "settings-automation"
include_in_global_search = false

  [[launcher_provider.category]]
  label = "User"
  glyph = "user"

  [[launcher_provider.category]]
  label = "System"
  glyph = "server"
