id          = "srounce/systemd"
name        = "Systemd Units"
version     = "1.1.0"
plugin_api  = 24
author      = "srounce"
license     = "MIT"
icon        = "settings-automation"
description = "Fuzzy-find systemd user and system units from the launcher and start, stop or restart them, or pin a unit to the bar with its state and controls."
tags        = ["launcher", "bar", "system", "utility"]
dependencies = ["systemctl"]

[[setting]]
key       = "scopes"
type      = "select"
label_key = "settings.scopes.label"
description_key = "settings.scopes.description"
default   = "both"
options = [
  { value = "both",   label_key = "settings.scopes.options.both" },
  { value = "user",   label_key = "settings.scopes.options.user" },
  { value = "system", label_key = "settings.scopes.options.system" },
]

[[setting]]
key       = "unit_types"
type      = "string_list"
label_key = "settings.unit_types.label"
description_key = "settings.unit_types.description"
default   = ["service"]

[[setting]]
key       = "system_wrapper"
type      = "string"
label_key = "settings.system_wrapper.label"
description_key = "settings.system_wrapper.description"
default   = ""
advanced  = true

[[launcher_provider]]
id     = "units"
entry  = "launcher.luau"
prefix = "svc"
glyph  = "settings-automation"
include_in_global_search = false

  [[launcher_provider.category]]
  label = "User"
  glyph = "user"

  [[launcher_provider.category]]
  label = "System"
  glyph = "server"

[[widget]]
id    = "unit-status"
entry = "widget.luau"

  [[widget.setting]]
  key       = "unit"
  type      = "string"
  label_key = "settings.unit.label"
  description_key = "settings.unit.description"
  default   = ""

  [[widget.setting]]
  key       = "scope"
  type      = "select"
  label_key = "settings.scope.label"
  description_key = "settings.scope.description"
  default   = "system"
  options = [
    { value = "system", label_key = "settings.scope.options.system" },
    { value = "user",   label_key = "settings.scope.options.user" },
  ]

  [[widget.setting]]
  key       = "show_label"
  type      = "bool"
  label_key = "settings.show_label.label"
  description_key = "settings.show_label.description"
  default   = false

[[panel]]
id         = "controls"
entry      = "panel.luau"
width      = 320
height     = 150
placement  = "attached"
position   = "auto"
open_near_click = true
dismiss_on_outside_click = true

[[service]]
id    = "actions"
entry = "service.luau"
