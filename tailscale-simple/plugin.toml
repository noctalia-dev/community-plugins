# Tailscale VPN status, peers, and exit-node control.

id = "alivault/tailscale-simple"
name = "Tailscale Simple"
version = "1.0.4"
plugin_api = 30
author = "alivault"
license = "MIT"
dependencies = ["tailscale", "jq", "xdg-open"]
tags = ["network", "utility", "bar", "panel", "service", "launcher"]
icon = "circles"
description = "A compact Tailscale panel with connection switches, device actions, exit nodes, and theme-aware dots."

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 10
min = 3
max = 120

[[setting]]
key = "notify_on_peer_change"
type = "bool"
label_key = "settings.notify_on_peer_change.label"
description_key = "settings.notify_on_peer_change.description"
default = true

[[setting]]
key = "taildrop_auto_receive"
type = "bool"
label_key = "settings.taildrop_auto_receive.label"
description_key = "settings.taildrop_auto_receive.description"
default = false

[[setting]]
key = "taildrop_directory"
type = "string"
label_key = "settings.taildrop_directory.label"
description_key = "settings.taildrop_directory.description"
default = ""

[[setting]]
key = "taildrop_notify"
type = "bool"
label_key = "settings.taildrop_notify.label"
description_key = "settings.taildrop_notify.description"
default = true

[[setting]]
key = "tailscale_bin"
type = "string"
label_key = "settings.tailscale_bin.label"
description_key = "settings.tailscale_bin.description"
default = "tailscale"
advanced = true

[[setting]]
key = "admin_url"
type = "string"
label_key = "settings.admin_url.label"
description_key = "settings.admin_url.description"
default = ""
advanced = true

[[setting]]
key = "ssh_user"
type = "string"
label_key = "settings.ssh_user.label"
description_key = "settings.ssh_user.description"
default = ""
advanced = true

[[widget]]
id = "status"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle alivault/tailscale-simple:manager"

  [[widget.setting]]
  key = "show_counts"
  type = "bool"
  label_key = "settings.show_counts.label"
  description_key = "settings.show_counts.description"
  default = false

[[panel]]
id = "manager"
entry = "panel.luau"
width = 460
height = 580
placement = "attached"
position = "auto"
open_near_click = true
keyboard_focus = "exclusive"
dismiss_on_outside_click = true

[[service]]
id = "service"
entry = "service.luau"

[[launcher_provider]]
id = "ts"
entry = "launcher.luau"
prefix = "tss"
glyph = "circles"
include_in_global_search = false
debounce_ms = 80
