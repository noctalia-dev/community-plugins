id = "tordex/system-updater"
name = "System Updates Manager"
version = "1.0.0"
plugin_api = 20
author = "tordex"
license = "MIT"
dependencies = "[pkgcli", "cargo", "cargo-install-update", "python", "flatpak"]
tags = ["bar", "panel", "service", "system"]
icon = "package"
description = "Manage system updates (PackageKit, Flatpak, Cargo etc.)."

[[setting]]
key = "enable_packagekit"
type = "bool"
label_key = "settings.enable_packagekit.label"
description_key = "settings.enable_packagekit.description"
default = true

[[setting]]
key = "enable_flatpak"
type = "bool"
label_key = "settings.enable_flatpak.label"
description_key = "settings.enable_flatpak.description"
default = true

[[setting]]
key = "enable_cargo"
type = "bool"
label_key = "settings.enable_cargo.label"
description_key = "settings.enable_cargo.description"
default = true

[[setting]]
key = "auto_check_minutes"
type = "int"
label_key = "settings.auto_check_minutes.label"
description_key = "settings.auto_check_minutes.description"
default = 60
min = 0
max = 1440

[[setting]]
key = "adapters_folder"
type = "folder"
label_key = "settings.adapters_folder.label"
description_key = "settings.adapters_folder.description"
default = ""

[[setting]]
key = "notify_on_updates"
type = "bool"
label_key = "settings.notify_on_updates.label"
description_key = "settings.notify_on_updates.description"
default = true

[[widget]]
id = "status"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "package"

  [[widget.setting]]
  key = "show_count"
  type = "bool"
  label_key = "settings.show_count.label"
  description_key = "settings.show_count.description"
  default = true

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 500
height = 600
placement = "attached"
open_near_click = true
