id = "zhangdm/als-brightness"
name = "ALS Brightness"
version = "0.5.0"
# Cumulative API levels. 23 = async-file-read, 24 = direct-argv. Both are used:
# the service reads sysfs (sync readFile, measured at 0.03 ms, so the async path
# is not needed here) and launches `noctalia msg` with an argv table rather than
# a shell string, which is API 24.
plugin_api = 24
author = "zhangdm"
license = "MIT"
icon = "sun"
description = "Adapts panel brightness and keyboard backlight to ambient light, and hands control back the moment you touch the keys."
dependencies = ["noctalia"]
tags = ["hardware", "system"]

# Settings render in declaration order, so this first block is the head of the
# page. The threshold sliders follow, then the advanced map editors.

[[setting]]
key = "learning_profile"
type = "bool"
label_key = "settings.learning_profile.label"
description_key = "settings.learning_profile.description"
default = false

# Keyboard backlight: opt-in master toggle. Off by default -- the keyboard
# backlight stays the owner's until they ask for this, and manual (Fn key)
# changes are adopted rather than fought.

[[setting]]
key = "keyboard_backlight"
type = "bool"
label_key = "settings.keyboard_backlight.label"
description_key = "settings.keyboard_backlight.description"
default = false

# Keyboard threshold and dark level. Gated on the toggle above (the host's
# conditional visibility, same as the temperature sliders on colortemp): the
# rows would otherwise read as live controls over a dead feature.
#
# Every window is a percent of something the owner already has a feel for -- the
# panel curve, the threshold itself, the LED's max -- never a raw sensor count,
# which would not translate between machines. Defaults and windows are
# keyboard.luau DEFAULTS / WINDOWS, checked against these literals by the
# settings-surface drift check. The dark level's zero means automatic: the
# lowest non-off level the LED can hold.

[[setting]]
key = "kbd_anchor_percent"
type = "int"
label_key = "settings.kbd_anchor_percent.label"
description_key = "settings.kbd_anchor_percent.description"
default = 40
min = 25
max = 75
step = 1
visible_when = { key = "keyboard_backlight", values = ["true"] }

[[setting]]
key = "kbd_buffer_percent"
type = "int"
label_key = "settings.kbd_buffer_percent.label"
description_key = "settings.kbd_buffer_percent.description"
default = 15
min = 0
max = 50
step = 1
visible_when = { key = "keyboard_backlight", values = ["true"] }

[[setting]]
key = "kbd_dark_percent"
type = "int"
label_key = "settings.kbd_dark_percent.label"
description_key = "settings.kbd_dark_percent.description"
default = 0
min = 0
max = 100
step = 1
visible_when = { key = "keyboard_backlight", values = ["true"] }

# The curves: per-node threshold sliders (Phase 6).
#
# Each slider moves ONE node along the ambient axis. The output the node puts out
# is a fixed constant -- curve.luau FIXED_BRIGHTNESS_Y / FIXED_TEMPERATURE_Y, echoed
# in each label -- so the shape of the curve is never in question and the slider
# only answers "where does this step apply?". Moving a slider past its neighbour is
# fine: curve.buildNodes sorts the nodes and repairs them to strictly increasing,
# so crossing thresholds can never break the interpolation.
#
# This shape replaced the Phase 3 `string_map` node editor, which proved unusable
# on the host: each row commits to its own sub-path while the host resolves
# "overridden" on the map as a whole, so the FIRST edit masks every other row and
# only the edited value stays live. That is host override semantics, not something
# a plugin can patch. A scalar setting commits to its own path, so no row here can
# mask a sibling -- which is exactly why these are 20 plain `int` settings.
#
# The defaults below reproduce the shipped nodes exactly (run-tests.sh asserts the
# sliders rebuild the old maps), so behaviour is unchanged until a slider is moved.
# Values between nodes are joined with PCHIP (curve.luau), which cannot overshoot
# the two nodes it sits between.

# Brightness: one slider per node. default = the shipped node's ambient reading
# (raw sensor counts), min/max ≈ a third / triple of it (the top node is capped at
# the sensor's 16384-count ceiling). The fixed output at each node lives in
# curve.luau and is repeated in the label.

[[setting]]
key = "thr_brightness_01"
type = "int"
label_key = "settings.thr_brightness_01.label"
description_key = "settings.thr_brightness_01.description"
default = 1
min = 0
max = 3
step = 1

