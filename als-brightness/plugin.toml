# Toggle controlling the map editors below. Plugin-owned, so the switch lives in
# the sheet itself rather than behind the settings window's global Advanced
# filter, which does not rebuild an open plugin sheet.
[[setting]]
key = "show_advanced"
type = "bool"
label_key = "settings.show_advanced.label"
description_key = "settings.show_advanced.description"
default = false

# The map editors, revealed by the "Advanced maps" toggle (Phase 6).
#
# These are the full-curve escape hatch: editing ANY row away from its shipped
# default makes the map override ALL the sliders above (the service logs which
# source built the curve). At their shipped defaults they are inert and the
# sliders are authoritative. Keep them here rather than deleting them -- they are
# the only way to reshape a curve radically (change a node count or an output).
#
# A node is "reading:target". The reading is the raw sensor count for brightness
# and the ambient kelvin for temperature. Two spellings both work, so the map can
# be edited without having to keep the key in step:
#
#   "00185" = "185:70"   the value carries the whole node
#   "00185" = "70"       the value is just the target; the key supplies the reading
#
# The value always wins; the keys stay zero-padded so rows sort in numeric order.
# A '#' starts a comment and blank rows are ignored.

[[setting]]
key = "curve_brightness"
type = "string_map"
label_key = "settings.curve_brightness.label"
description_key = "settings.curve_brightness.description"
visible_when = { key = "show_advanced", values = ["true"] }

[setting.default]
"00001" = "1:20.8"
"00004" = "4:30.7"
"00010" = "10:39.3"
"00030" = "30:50.6"
"00100" = "100:63.4"
"00185" = "185:70"
"00400" = "400:78.3"
"01000" = "1000:88.3"
"02200" = "2200:96.8"
"16384" = "16384:100"

[[setting]]
key = "curve_temperature"
type = "string_map"
label_key = "settings.curve_temperature.label"
description_key = "settings.curve_temperature.description"
visible_when = { key = "show_advanced", values = ["true"] }

[setting.default]
"02500" = "2500:5100"
"02700" = "2700:5240"
"03000" = "3000:5380"
"03500" = "3500:5520"
"04000" = "4000:5660"
"04500" = "4500:5800"
"05000" = "5000:5940"
"05500" = "5500:6080"
"06000" = "6000:6220"
"06500" = "6500:6500"

[[setting]]
key = "enabled"
type = "bool"
label_key = "settings.enabled.label"
description_key = "settings.enabled.description"
default = true

# Output to drive: empty = the first output Noctalia reports at start (focused
# preferred), explicit = that output, validated at start. Discovery runs once, so
# a change here takes effect on the next plugin restart.
[[setting]]
key = "connector"
type = "string"
label_key = "settings.connector.label"
description_key = "settings.connector.description"
default = ""

# Backlight device: empty = first under /sys/class/backlight (sorted), explicit =
# validated at start against the directory.
[[setting]]
key = "backlight"
type = "string"
label_key = "settings.backlight.label"
description_key = "settings.backlight.description"
default = ""

[[setting]]
key = "min_percent"
type = "string"
label_key = "settings.min_percent.label"
description_key = "settings.min_percent.description"
default = "15"

[[setting]]
key = "max_percent"
type = "string"
label_key = "settings.max_percent.label"
description_key = "settings.max_percent.description"
default = "100"

[[setting]]
key = "colortemp"
type = "bool"
label_key = "settings.colortemp.label"
description_key = "settings.colortemp.description"
