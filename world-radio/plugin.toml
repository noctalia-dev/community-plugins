id          = "nilsonlinux/world-radio"
name        = "World Radio"
version     = "1.2.2"
plugin_api  = 43
author      = "Nilsonlinux"
license     = "MIT"
icon        = "radio"
description = "Browse thousands of radio stations from around the world with country flags."
tags        = ["audio", "music", "network", "panel", "bar", "utility", "service"]
dependencies = ["mpv", "ffmpeg", "mpv-mpris", "glib2"]

# ---------------------------------------------------------------------------
# Bar widget: opens the World Radio panel
# ---------------------------------------------------------------------------

[[widget]]
id    = "radio"
entry = "widget.luau"

  [[widget.setting]]
  key             = "glyph"
  type            = "glyph"
  label_key       = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default         = "radio"

  [[widget.setting]]
  key             = "show_now_playing"
  type            = "bool"
  label_key       = "settings.show_now_playing.label"
  description_key = "settings.show_now_playing.description"
  default         = false

# ---------------------------------------------------------------------------
# Panel: dashboard with countries + stations
# ---------------------------------------------------------------------------

[[panel]]
id              = "Panel"
entry           = "panel.luau"
width           = 540
height          = 720
placement       = "floating"
position        = "center"
open_near_click = false

# ---------------------------------------------------------------------------
# Service: follows mpv's MPRIS playback and services wheel-skip requests even
# while the panel is closed.
# ---------------------------------------------------------------------------

[[service]]
id    = "sync"
entry = "sync.luau"