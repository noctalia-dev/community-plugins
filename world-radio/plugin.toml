id          = "nilsonlinux/world-radio"
name        = "World Radio"
version     = "1.0.5"
plugin_api  = 24
author      = "Nilsonlinux"
license     = "MIT"
icon        = "radio"
description = "Browse thousands of radio stations from around the world with country flags."
tags        = ["audio", "music", "network", "panel", "bar", "utility"]
dependencies = ["mpv", "ffmpeg", "playerctl"]

# ---------------------------------------------------------------------------
# Bar widget: opens the World Radio panel
# ---------------------------------------------------------------------------

[[widget]]
id    = "radio"
entry = "widget.luau"

  [[widget.setting]]
  key             = "glyph"
  type            = "glyph"
  label_key       = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default         = "radio"

  [[widget.setting]]
  key             = "show_now_playing"
  type            = "bool"
  label_key       = "settings.show_now_playing.label"
  description_key = "settings.show_now_playing.description"
  default         = true

# ---------------------------------------------------------------------------
# Panel: dashboard with countries + stations
# ---------------------------------------------------------------------------

[[panel]]
id              = "Panel"
entry           = "panel.luau"
width           = 540
height          = 720
placement       = "attached"
position        = "auto"
open_near_click = true