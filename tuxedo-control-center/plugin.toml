id = "detluck/tuxedo-control-center"
name = "TUXEDO Control Center"
version = "0.1.0"
plugin_api = 46
author = "detluck"
license = "MIT"
icon = "cpu"
description = "Switch every TUXEDO Control Center power profile from a Noctalia panel."
tags = ["bar", "panel", "hardware"]
dependencies = ["busctl", "tccd"]

[[setting]]
key = "show_default_profiles"
type = "bool"
label_key = "settings.show_default_profiles.label"
description_key = "settings.show_default_profiles.description"
default = true

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "profiles"
entry = "panel.luau"
width = 360
height = "content"
max_height = 640
placement = "attached"
position = "auto"
keyboard_focus = "on_demand"

[[widget]]
id = "bar"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle detluck/tuxedo-control-center:profiles"
