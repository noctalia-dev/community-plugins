id = "h465855hgg/cursor-effects"
name = "Cursor Effects"
version = "0.2.0"
plugin_api = 56
author = "h465855hgg"
license = "MIT"
dependencies = ["python3", "umbriel"]
icon = "pointer"
description = "Switch Umbriel cursor themes and cursor shader effects."
tags = ["bar", "panel", "theming", "utility", "umbriel"]

[[widget]]
id = "cursor-effects"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle h465855hgg/cursor-effects:panel"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 760
height = 640
placement = "attached"
