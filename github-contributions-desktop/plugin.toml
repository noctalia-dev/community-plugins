id = "darulqutni-q/github-contributions-desktop"
name = "GitHub Contributions"
version = "1.0.0"
plugin_api = 43
author = "DarulQutni-Q"
license = "MIT"
icon = "brand-github"
description = "A GitHub contribution calendar as a Noctalia desktop widget."
tags = ["desktop", "service", "development", "productivity", "utility", "network", "hyprland", "arch"]
dependencies = ["gh"]

[[setting]]
key = "refresh_interval_minutes"
type = "select"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = "30"
options = [
  { value = "15", label_key = "settings.refresh_interval.options.fifteen" },
  { value = "30", label_key = "settings.refresh_interval.options.thirty" },
  { value = "60", label_key = "settings.refresh_interval.options.sixty" },
]

[[service]]
id = "sync"
entry = "sync.luau"

[[desktop_widget]]
id = "calendar"
entry = "desktop.luau"

  [[desktop_widget.setting]]
  key = "color"
  type = "color"
  label_key = "settings.desktop_color.label"
  description_key = "settings.desktop_color.description"
  default = "#39d353"

  [[desktop_widget.setting]]
  key = "cell_size"
  type = "int"
  label_key = "settings.cell_size.label"
  description_key = "settings.cell_size.description"
  default = 10
  min = 6
  max = 16
