id = "abuamar142/murattal"
name = "Murattal"
version = "0.3.1"
plugin_api = 43
author = "abuamar142"
license = "MIT"
icon = "music-note"
description = "Stream murottal Al-Qur'an per surah or per ayah, with Arabic text and translation, via mpv."
dependencies = ["mpv", "socat"]
tags = ["bar", "panel", "service", "launcher", "audio", "media", "music"]

[[setting]]
key = "default_volume"
type = "int"
label_key = "settings.default_volume.label"
description_key = "settings.default_volume.description"
default = 65
min = 0
max = 100

[[setting]]
key = "mpv_bin"
type = "string"
label_key = "settings.mpv_bin.label"
description_key = "settings.mpv_bin.description"
default = "mpv"

[[service]]
id = "player"
entry = "service.luau"

[[widget]]
id = "murottal"
entry = "widget.luau"

  [[widget.setting]]
  key = "show_name"
  type = "bool"
  label_key = "settings.show_name.label"
  default = true

  [[widget.setting]]
  key = "max_length"
  type = "int"
  label_key = "settings.max_length.label"
  default = 24
  min = 5
  max = 60

[[panel]]
id = "browser"
entry = "panel.luau"
width = 640
height = 760
placement = "floating"
position = "center"

  [[panel.setting]]
  key = "show_translation"
  type = "bool"
  label_key = "settings.show_translation.label"
  description_key = "settings.show_translation.description"
  default = true

  [[panel.setting]]
  key = "show_latin"
  type = "bool"
  label_key = "settings.show_latin.label"
  description_key = "settings.show_latin.description"
  default = false

[[launcher_provider]]
id = "finder"
entry = "finder.luau"
prefix = "quran"
glyph = "music-note"
include_in_global_search = false
debounce_ms = 300
