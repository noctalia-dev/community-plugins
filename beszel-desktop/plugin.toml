id           = "henriksvensson/beszel-desktop"
name         = "Beszel Desktop"
version      = "0.4.0"
plugin_api   = 48
author       = "henriksvensson"
license      = "MIT"
icon         = "cpu-usage"
description  = "Monitor remote hosts live from a Beszel hub."
tags         = ["bar", "panel", "service", "system", "indicator"]
dependencies = ["beszel-ctl"]

[[setting]]
key             = "warn_threshold"
type            = "int"
label_key       = "settings.warn_threshold.label"
description_key = "settings.warn_threshold.description"
default         = 70
min             = 10
max             = 99

[[setting]]
key             = "danger_threshold"
type            = "int"
label_key       = "settings.danger_threshold.label"
description_key = "settings.danger_threshold.description"
default         = 90
min             = 11
max             = 100

[[setting]]
key             = "stale_seconds"
type            = "int"
label_key       = "settings.stale_seconds.label"
description_key = "settings.stale_seconds.description"
default         = 5
min             = 2
max             = 60
advanced        = true

[[setting]]
key             = "ctl_path"
type            = "string"
label_key       = "settings.ctl_path.label"
description_key = "settings.ctl_path.description"
default         = "beszel-ctl"
advanced        = true

[[setting]]
key             = "socket_path"
type            = "string"
label_key       = "settings.socket_path.label"
description_key = "settings.socket_path.description"
default         = ""
advanced        = true

[[widget]]
id    = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key             = "system"
  type            = "string"
  label_key       = "settings.system.label"
  description_key = "settings.system.description"
  default         = ""

  [[widget.setting]]
  key             = "show_host_name"
  type            = "bool"
  label_key       = "settings.show_host_name.label"
  description_key = "settings.show_host_name.description"
  default         = true

  [[widget.setting]]
  key             = "show_cpu"
  type            = "bool"
  label_key       = "settings.show_cpu.label"
  description_key = "settings.show_cpu.description"
  default         = true

  [[widget.setting]]
  key             = "show_memory"
  type            = "bool"
  label_key       = "settings.show_memory.label"
  description_key = "settings.show_memory.description"
  default         = true

  [[widget.setting]]
  key             = "show_gpu"
  type            = "bool"
  label_key       = "settings.show_gpu.label"
  description_key = "settings.show_gpu.description"
  default         = false

  [[widget.setting]]
  key             = "show_temp"
  type            = "bool"
  label_key       = "settings.show_temp.label"
  description_key = "settings.show_temp.description"
  default         = false

  [[widget.setting]]
  key             = "show_disk"
  type            = "bool"
  label_key       = "settings.show_disk.label"
  description_key = "settings.show_disk.description"
  default         = false

  [[widget.setting]]
  key             = "network_mode"
  type            = "select"
  label_key       = "settings.network_mode.label"
  description_key = "settings.network_mode.description"
  default         = "off"
  options         = [
    { value = "off",      label_key = "settings.network_mode.options.off" },
    { value = "split",    label_key = "settings.network_mode.options.split" },
    { value = "combined", label_key = "settings.network_mode.options.combined" },
    { value = "download", label_key = "settings.network_mode.options.download" },
    { value = "upload",   label_key = "settings.network_mode.options.upload" },
  ]

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 660
height          = "content"
max_height      = 640
placement       = "attached"
position        = "auto"
open_near_click = true

  [[panel.setting]]
  key             = "show_vitals"
  type            = "bool"
  label_key       = "settings.panel.show_vitals.label"
  description_key = "settings.panel.show_vitals.description"
  default         = true

  [[panel.setting]]
  key             = "show_load"
  type            = "bool"
  label_key       = "settings.panel.show_load.label"
  description_key = "settings.panel.show_load.description"
  default         = false

  [[panel.setting]]
  key             = "show_cores"
  type            = "bool"
  label_key       = "settings.panel.show_cores.label"
  description_key = "settings.panel.show_cores.description"
  default         = true

  [[panel.setting]]
  key             = "show_swap"
  type            = "bool"
  label_key       = "settings.panel.show_swap.label"
  description_key = "settings.panel.show_swap.description"
  default         = true

  [[panel.setting]]
  key             = "show_gpu"
  type            = "bool"
  label_key       = "settings.panel.show_gpu.label"
  description_key = "settings.panel.show_gpu.description"
  default         = true

  [[panel.setting]]
  key             = "show_network"
  type            = "bool"
  label_key       = "settings.panel.show_network.label"
  description_key = "settings.panel.show_network.description"
  default         = true

  [[panel.setting]]
  key             = "show_disk"
  type            = "bool"
  label_key       = "settings.panel.show_disk.label"
  description_key = "settings.panel.show_disk.description"
  default         = true

  [[panel.setting]]
  key             = "show_containers"
  type            = "bool"
  label_key       = "settings.panel.show_containers.label"
  description_key = "settings.panel.show_containers.description"
  default         = false

[[service]]
id    = "service"
entry = "service.luau"
