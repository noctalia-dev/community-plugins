id           = "robpidev/ai-hub"
name         = "AI Hub"
version      = "0.2.1"
plugin_api   = 43
author       = "robpidev"
license      = "MIT"
icon         = "sparkles"
description  = "Chat with any OpenAI-compatible provider: local gateways, cheap clouds and the big ones, from one panel."
tags         = ["ai", "network", "productivity", "utility"]
dependencies = []

[[widget]]
id    = "status"
entry = "widget.luau"

  [[widget.setting]]
  key       = "glyph"
  type      = "glyph"
  label_key = "settings.widget.glyph.label"
  default   = "sparkles"

[[panel]]
id             = "chat"
entry          = "panel.luau"
width          = 750
height         = 700
placement      = "floating"
position       = "center"
keyboard_focus = "on_demand"

[[service]]
id    = "brain"
entry = "service.luau"

# ---------------------------------------------------------------------------
# Plugin-level settings: shared by the service, the panel and the widget.
# ---------------------------------------------------------------------------

[[setting]]
key             = "provider"
type            = "select"
label_key       = "settings.provider.label"
description_key = "settings.provider.description"
default         = "omniroute"
options = [
  { value = "omniroute",        label_key = "provider.omniroute" },
  { value = "cheaperinference", label_key = "provider.cheaperinference" },
  { value = "gemini",           label_key = "provider.gemini" },
  { value = "groq",             label_key = "provider.groq" },
  { value = "openrouter",       label_key = "provider.openrouter" },
  { value = "ollama",           label_key = "provider.ollama" },
  { value = "zen",              label_key = "provider.zen" },
  { value = "custom",           label_key = "provider.custom" },
]

[[setting]]
key             = "endpoint"
type            = "string"
label_key       = "settings.endpoint.label"
description_key = "settings.endpoint.description"
default         = ""

[[setting]]
key             = "api_key"
type            = "string"
label_key       = "settings.api_key.label"
description_key = "settings.api_key.description"
default         = ""
advanced        = true
visible_when    = { key = "key_source", values = ["manual"] }

[[setting]]
key             = "key_source"
type            = "select"
label_key       = "settings.key_source.label"
description_key = "settings.key_source.description"
default         = "manual"
options = [
  { value = "manual",    label_key = "key_source.manual" },
  { value = "auth.json", label_key = "key_source.auth" },
]

[[setting]]
key             = "auth_provider"
type            = "string"
label_key       = "settings.auth_provider.label"
description_key = "settings.auth_provider.description"
default         = ""
visible_when    = { key = "key_source", values = ["auth.json"] }

[[setting]]
key             = "model"
type            = "string"
label_key       = "settings.model.label"
description_key = "settings.model.description"
default         = ""

[[setting]]
key             = "stream"
type            = "bool"
label_key       = "settings.stream.label"
description_key = "settings.stream.description"
default         = true

[[setting]]
key             = "tool_permission"
type            = "select"
label_key       = "settings.tool_permission.label"
description_key = "settings.tool_permission.description"
default         = "off"
options = [
  { value = "off",   label_key = "tool_permission.off" },
  { value = "ask",   label_key = "tool_permission.ask" },
  { value = "allow", label_key = "tool_permission.allow" },
]

[[setting]]
key             = "web_search"
type            = "bool"
label_key       = "settings.web_search.label"
description_key = "settings.web_search.description"
default         = false

[[setting]]
key             = "tool_blocklist"
type            = "string_list"
label_key       = "settings.tool_blocklist.label"
description_key = "settings.tool_blocklist.description"
default         = [
  "rm -rf /",
  "rm -rf /*",
  "mkfs",
  "dd if=/dev/zero",
  "dd if=/dev/random",
  "> /dev/sda",
  "chmod -R 777 /",
  "chown -R /",
  "shutdown",
  "reboot",
  "poweroff",
  "init 0",
  "systemctl poweroff",
  ":(){:|:&};:",
  "curl | sh",
  "curl | bash",
  "wget | sh",
  "wget | bash",
]

[[setting]]
key             = "max_tokens"
type            = "int"
label_key       = "settings.max_tokens.label"
description_key = "settings.max_tokens.description"
default         = 0
min             = 0
max             = 200000
advanced        = true

[[setting]]
key             = "max_history"
type            = "int"
label_key       = "settings.max_history.label"
description_key = "settings.max_history.description"
default         = 40
min             = 2
max             = 200

[[setting]]
key             = "system_prompt"
type            = "string"
label_key       = "settings.system_prompt.label"
description_key = "settings.system_prompt.description"
default         = ""
advanced        = true

[[setting]]
key             = "panel_width"
type            = "int"
label_key       = "settings.panel_width.label"
description_key = "settings.panel_width.description"
default         = 500
min             = 300
max             = 1200

[[setting]]
key             = "panel_height"
type            = "int"
label_key       = "settings.panel_height.label"
description_key = "settings.panel_height.description"
default         = 700
min             = 400
max             = 1200

[[setting]]
key             = "key_store_mode"
type            = "select"
label_key       = "settings.key_store_mode.label"
description_key = "settings.key_store_mode.description"
default         = "per_provider"
options = [
  { value = "global",        label_key = "settings.key_store_mode.global" },
  { value = "per_provider",  label_key = "settings.key_store_mode.per_provider" },
]
