  type            = "string"
  label_key       = "settings.separator.label"
  description_key = "settings.separator.description"
  default         = "-"

  [[desktop_widget.setting]]
  key             = "separator_color"
  type            = "color"
  label_key       = "settings.separator_color.label"
  description_key = "settings.separator_color.description"
  default         = "on_surface"

  [[desktop_widget.setting]]
  key             = "hide_on_empty"
  type            = "bool"
