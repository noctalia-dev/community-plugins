id = "levi/warp"
name = "Cloudflare WARP"
version = "1.2.0"
plugin_api = 3
author = "Levi"
license = "MIT"
dependencies = ["warp-cli"]
tags = ["bar", "indicator", "network", "privacy", "shortcut"]
icon = "cloud-lock"
description = "Toggle Cloudflare WARP from the bar or Control Center."

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "warp"
entry = "widget.luau"

[[shortcut]]
id = "toggle"
entry = "shortcut.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 520
placement = "attached"
position = "auto"
open_near_click = true
