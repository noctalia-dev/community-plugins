id           = "knyrps/nix-search"
name         = "Nix Search"
version      = "0.1.0"
plugin_api   = 24
author       = "knyrps"
license      = "MIT"
description  = "Search nixpkgs, NixOS, Home Manager and NUR from the launcher via nix-search-tv"
tags         = ["launcher", "service", "utility", "development"]
dependencies = ["nix-search-tv", "fzf"]
icon         = "snowflake"

[[launcher_provider]]
id          = "nix-search-provider"
entry       = "provider.luau"
prefix      = "nix"
glyph       = "snowflake"
debounce_ms = 80

[[service]]
id    = "nix-search-index"
entry = "service.luau"
