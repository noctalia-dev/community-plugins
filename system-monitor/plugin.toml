id = "tmelik/system-monitor"
name = "System Monitor"
version = "1.5.1"
plugin_api = 26
author = "TMelik"
license = "GPL-3.0-only"
dependencies = ["ps", "cat"]
tags = ["bar", "indicator", "system"]
icon = "cpu"
description = "A compact bar widget combining CPU, optional GPU, memory, disk, and network activity."

[[widget]]
id = "summary"
entry = "widget.luau"

[widget.actions]
left = "panel-toggle control-center system"

[[widget.setting]]
key = "show_cpu_usage"
type = "bool"
label_key = "settings.show_cpu_usage.label"
default = true

[[widget.setting]]
key = "show_cpu_temperature"
type = "bool"
label_key = "settings.show_cpu_temperature.label"
default = true

[[widget.setting]]
key = "show_gpu_usage"
type = "select"
label_key = "settings.show_gpu_usage.label"
description_key = "settings.show_gpu_usage.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.tri_state.auto" },
  { value = "on", label_key = "settings.tri_state.on" },
  { value = "off", label_key = "settings.tri_state.off" },
]

[[widget.setting]]
key = "show_gpu_temperature"
type = "select"
label_key = "settings.show_gpu_temperature.label"
description_key = "settings.show_gpu_temperature.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.tri_state.auto" },
  { value = "on", label_key = "settings.tri_state.on" },
  { value = "off", label_key = "settings.tri_state.off" },
]

[[widget.setting]]
key = "show_gpu_vram"
type = "select"
label_key = "settings.show_gpu_vram.label"
description_key = "settings.show_gpu_vram.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.tri_state.auto" },
  { value = "on", label_key = "settings.tri_state.on" },
  { value = "off", label_key = "settings.tri_state.off" },
]

[[widget.setting]]
key = "show_ram"
type = "bool"
label_key = "settings.show_ram.label"
default = true

[[widget.setting]]
key = "show_swap"
type = "bool"
label_key = "settings.show_swap.label"
default = true

[[widget.setting]]
key = "show_disk"
type = "bool"
label_key = "settings.show_disk.label"
default = true

[[widget.setting]]
key = "show_download"
type = "bool"
label_key = "settings.show_download.label"
default = true

[[widget.setting]]
key = "show_upload"
type = "bool"
label_key = "settings.show_upload.label"
default = true

[[widget.setting]]
key = "highlight_values"
type = "bool"
label_key = "settings.highlight_values.label"
default = true

[[widget.setting]]
key = "activity_color"
type = "color"
label_key = "settings.activity_color.label"
default = "primary"

[[widget.setting]]
key = "critical_color"
type = "color"
label_key = "settings.critical_color.label"
default = "error"

[[widget.setting]]
key = "hide_unavailable"
type = "bool"
label_key = "settings.hide_unavailable.label"
default = false

[[widget.setting]]
key = "show_separators"
type = "bool"
label_key = "settings.show_separators.label"
default = true

[[widget.setting]]
key = "show_tooltip"
type = "bool"
label_key = "settings.show_tooltip.label"
default = true

[[widget.setting]]
key = "show_cpu_details_in_tooltip"
type = "bool"
label_key = "settings.show_cpu_details_in_tooltip.label"
description_key = "settings.show_cpu_details_in_tooltip.description"
default = false

[[widget.setting]]
key = "show_top_processes"
type = "bool"
label_key = "settings.show_top_processes.label"
description_key = "settings.show_top_processes.description"
default = true

[[widget.setting]]
key = "compact_network"
type = "bool"
label_key = "settings.compact_network.label"
description_key = "settings.compact_network.description"
default = true

[[widget.setting]]
key = "network_interface"
type = "string"
label_key = "settings.network_interface.label"
description_key = "settings.network_interface.description"
default = ""

[[widget.setting]]
key = "ram_display_mode"
type = "select"
label_key = "settings.ram_display_mode.label"
default = "percentage"
options = [
  { value = "percentage", label_key = "settings.display_mode.percentage" },
  { value = "used", label_key = "settings.display_mode.used" },
  { value = "available", label_key = "settings.display_mode.available" },
]

[[widget.setting]]
key = "disk_display_mode"
type = "select"
label_key = "settings.disk_display_mode.label"
default = "percentage"
options = [
  { value = "percentage", label_key = "settings.display_mode.percentage" },
  { value = "used", label_key = "settings.display_mode.used" },
  { value = "available", label_key = "settings.display_mode.available" },
]

[[widget.setting]]
key = "disk_path"
type = "string"
label_key = "settings.disk_path.label"
description_key = "settings.disk_path.description"
default = "/"
