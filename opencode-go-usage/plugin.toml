id = "zumik3-del/opencode-go-usage"
name = "Opencode Go Usage"
version = "1.1.0"
plugin_api = 28
author = "zumik3-del"
license = "MIT"
icon = "brand-openai"
description = "Opencode Go usage limits in the bar, with a details panel for the 5-hour, weekly and monthly meters."
tags = ["bar", "panel", "service", "ai", "productivity", "indicator"]

# Plugin-level settings: one shared set, edited in Settings -> Plugins, readable
# from every entry via noctalia.getConfig(key).
[[setting]]
key = "api_key"
type = "string"
label_key = "settings.api_key.label"
description_key = "settings.api_key.description"
default = ""

[[setting]]
key = "refresh_interval_sec"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 1800
min = 60
max = 86400

# Widget entry settings: this bar widget's own presentation.
[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "bar_limit"
  type = "select"
  label_key = "settings.bar_limit.label"
  description_key = "settings.bar_limit.description"
  default = "5h"
  options = [
    { value = "5h", label_key = "settings.bar_limit.option_5h" },
    { value = "week", label_key = "settings.bar_limit.option_week" },
    { value = "month", label_key = "settings.bar_limit.option_month" },
    { value = "none", label_key = "settings.bar_limit.option_none" },
  ]

[[panel]]
id = "panel"
entry = "panel.luau"
width = 400
height = 280
placement = "attached"
position = "auto"
open_near_click = true

[[service]]
id = "usage"
entry = "service.luau"
