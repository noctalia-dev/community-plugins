<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
<!-- DualShock 4 illustration.
     inputs_card.luau replaces the {{...}} tokens and writes a generated copy
     into the plugin data directory. BTN_* tokens are swapped per input state in
     the compact "light buttons" view. -->
<path d="M60 15.5
         C47 15.5 37 16.5 30 19.5
         C23.5 22.3 19 28 16.5 36
         C14 44 12 53 11.5 61.5
         C11 71 13.5 79 18.5 81.5
         C23.5 84 29 80.5 32.5 74.5
         C35.5 69.5 38 67 42 67
         C50 64 70 64 78 67
         C82 67 84.5 69.5 87.5 74.5
         C91 80.5 96.5 84 101.5 81.5
         C106.5 79 109 71 108.5 61.5
         C108 53 106 44 103.5 36
         C101 28 96.5 22.3 90 19.5
         C83 16.5 73 15.5 60 15.5 Z"
      fill="#2c3035" fill-opacity="1.00" stroke="#e8ebef" stroke-width="2.80" stroke-linejoin="round"/>
<!-- L1 / R1 shoulder buttons -->
<path d="M22 21.8 C26 18.4 32 15.8 39 14.9" fill="none" stroke="#e8ebef" stroke-width="4.4" stroke-linecap="round"/>
<path d="M98 21.8 C94 18.4 88 15.8 81 14.9" fill="none" stroke="#e8ebef" stroke-width="4.4" stroke-linecap="round"/>
<!-- light bar along the top edge of the touchpad -->
<path d="M43.5 18.9 H72.5" stroke="#4a90e2" stroke-width="2.2" stroke-linecap="round"/>
<!-- touchpad -->
<rect x="41" y="19.5" width="34" height="17" rx="3" fill="#2c3035" fill-opacity="1.00" stroke="#e8ebef" stroke-width="1.5"/>
<!-- speaker -->
<g fill="#e8ebef" opacity="0.7">
  <circle cx="57.5" cy="40.6" r="0.9"/>
  <circle cx="60" cy="40.6" r="0.9"/>
  <circle cx="62.5" cy="40.6" r="0.9"/>
</g>
<g fill="none" stroke="#e8ebef" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- share / options -->
  <rect x="34.8" y="23.6" width="5.2" height="2.6" rx="1.3" stroke-width="1.2"/>
  <rect x="76" y="23.6" width="5.2" height="2.6" rx="1.3" stroke-width="1.2"/>
  <!-- d-pad -->
  <path d="M31.5 29 h5 v4.5 h4.5 v6 h-4.5 v4.5 h-5 v-4.5 h-4.5 v-6 h4.5 z" fill="#2c3035" fill-opacity="1.00"/>
  <!-- face buttons -->
  <path d="M86 25.5 L90 32.5 H82 Z" stroke="#6fe3a2" stroke-width="1.7"/>
  <circle cx="93" cy="36" r="4" stroke="#ff7a90" stroke-width="1.7"/>
  <path d="M83 39.5 l6 6 M89 39.5 l-6 6" stroke="#8ab4ff" stroke-width="1.7"/>
  <rect x="75.5" y="32.5" width="7.2" height="7.2" rx="1" stroke="#ff9ad5" stroke-width="1.7"/>
  <!-- left / right stick -->
  <circle cx="45" cy="57" r="9"/>
  <circle cx="45" cy="57" r="4.4" stroke-width="1.2" stroke-opacity="0.8"/>
  <circle cx="75" cy="57" r="9"/>
  <circle cx="75" cy="57" r="4.4" stroke-width="1.2" stroke-opacity="0.8"/>
  <!-- PS button -->
  <circle cx="60" cy="47" r="3.2"/>
  <circle cx="60" cy="47" r="1" fill="#e8ebef" stroke="none" fill-opacity="0.8"/>
</g>
<!-- live highlights: unlit tokens resolve to "none", so the art is unchanged
     until an input is pressed -->
<g stroke="none">
  <rect x="31.5" y="29" width="5" height="4.5" fill="none"/>
  <rect x="31.5" y="39.5" width="5" height="4.5" fill="none"/>
  <rect x="27" y="33.5" width="4.5" height="6" fill="none"/>
  <rect x="36" y="33.5" width="4.5" height="6" fill="none"/>
  <circle cx="45" cy="57" r="4.4" fill="none"/>
  <circle cx="75" cy="57" r="4.4" fill="none"/>
</g>
<path d="M22 21.8 C26 18.4 32 15.8 39 14.9" fill="none" stroke="#e8ebef" stroke-width="4.4" stroke-linecap="round"/>
<path d="M98 21.8 C94 18.4 88 15.8 81 14.9" fill="none" stroke="#e8ebef" stroke-width="4.4" stroke-linecap="round"/>
<path d="M22 21.8 C26 18.4 32 15.8 39 14.9" fill="none" stroke="none" stroke-width="4.4" stroke-linecap="round"/>
<path d="M98 21.8 C94 18.4 88 15.8 81 14.9" fill="none" stroke="none" stroke-width="4.4" stroke-linecap="round"/>
</svg>
