<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
<!-- Xbox / 8BitDo style controller illustration.
     inputs_card.luau replaces {{COLOR}}, {{BODY}}, {{BODY_OPACITY}} and
     {{STROKE_BODY}} and writes a generated copy into the plugin data directory. -->
<!-- L2/R2 triggers (vertical, above bumpers) -->

<path d="{{TRIG_L2_PATH}}" fill="{{TRIG_COLOR}}"/>
<path d="{{TRIG_R2_PATH}}" fill="{{TRIG_COLOR}}"/>
<rect x="21" y="13" width="28" height="11" rx="5.5" fill="{{BODY}}" fill-opacity="{{BODY_OPACITY}}" stroke="{{COLOR}}" stroke-width="1.5" stroke-opacity="0.85"/>
<rect x="71" y="13" width="28" height="11" rx="5.5" fill="{{BODY}}" fill-opacity="{{BODY_OPACITY}}" stroke="{{COLOR}}" stroke-width="1.5" stroke-opacity="0.85"/>
<rect x="21" y="13" width="28" height="11" rx="5.5" fill="{{BTN_L1}}" stroke="none"/>
<rect x="71" y="13" width="28" height="11" rx="5.5" fill="{{BTN_R1}}" stroke="none"/>
<path d="M34 19
         C28 19 23 22 20 28
         C16 36 12 52 11.5 64
         C11 74 14 80 20 81
         C26 82 31 78 34 72
         C36 68 38 65.5 43 65.5
         H77
         C82 65.5 84 68 86 72
         C89 78 94 82 100 81
         C106 80 109 74 108.5 64
         C108 52 104 36 100 28
         C97 22 92 19 86 19 Z"
      fill="{{BODY}}" fill-opacity="{{BODY_OPACITY}}" stroke="{{COLOR}}" stroke-width="{{STROKE_BODY}}" stroke-linejoin="round"/>
<g fill="none" stroke="{{COLOR}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- left stick -->
  <circle cx="35" cy="33" r="9.5"/>
  <circle cx="35" cy="33" r="4.6" stroke-width="1.2" stroke-opacity="0.8" fill="{{BTN_L3}}"/>
  <!-- d-pad -->
  <path d="M32.5 44 h5 v6.5 h6.5 v5 h-6.5 v6.5 h-5 v-6.5 h-6.5 v-5 h6.5 z" fill="{{BODY}}" fill-opacity="{{BODY_OPACITY}}"/>
  <rect x="32.5" y="44" width="5" height="6.5" fill="{{BTN_UP}}"/>
  <rect x="32.5" y="55.5" width="5" height="6.5" fill="{{BTN_DOWN}}"/>
  <rect x="26" y="50.5" width="6.5" height="5" fill="{{BTN_LEFT}}"/>
  <rect x="37.5" y="50.5" width="6.5" height="5" fill="{{BTN_RIGHT}}"/>
  <!-- right stick -->
  <circle cx="85" cy="52" r="9.5"/>
  <circle cx="85" cy="52" r="4.6" stroke-width="1.2" stroke-opacity="0.8" fill="{{BTN_R3}}"/>
<circle cx="{{STICK_LX}}" cy="{{STICK_LY}}" r="2.5" fill="{{STICK_COLOR}}"/>
<circle cx="{{STICK_RX}}" cy="{{STICK_RY}}" r="2.5" fill="{{STICK_COLOR}}"/>
  <!-- guide -->
  <circle cx="60" cy="27" r="4.6"/>
  <path d="M57.8 24.8 l4.4 4.4 M62.2 24.8 l-4.4 4.4" stroke-width="1.3"/>
  <!-- view / menu -->
  <circle cx="52" cy="37.5" r="2.2" stroke-width="1.2"/>
  <circle cx="68" cy="37.5" r="2.2" stroke-width="1.2"/>
  <!-- share -->
  <circle cx="60" cy="40" r="2.2" stroke-width="1.2"/>
</g>
<!-- A B X Y -->
<g font-family="sans-serif" font-size="6" font-weight="bold" text-anchor="middle">
  <circle cx="85" cy="23.5" r="5" fill="{{BTN_Y}}"/>
  <text x="85" y="25.8" fill="#ffffff">Y</text>
  <circle cx="78" cy="30.5" r="5" fill="{{BTN_X}}"/>
  <text x="78" y="32.8" fill="#ffffff">X</text>
  <circle cx="92" cy="30.5" r="5" fill="{{BTN_B}}"/>
  <text x="92" y="32.8" fill="#ffffff">B</text>
  <circle cx="85" cy="37.5" r="5" fill="{{BTN_A}}"/>
  <text x="85" y="39.8" fill="#ffffff">A</text>
</g>
</svg>
