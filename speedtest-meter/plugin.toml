id           = "nilsonlinux/speedtest-meter"
name         = "Speedtest Meter"
version      = "1.3.3"
plugin_api   = 18
author       = "Nilsonlinux"
license      = "MIT"
icon         = "brand-speedtest"
description  = "Run an internet speed test with a live speedometer and detailed results."
tags         = ["network", "indicator", "bar", "panel"]
dependencies = ["speedtest", "speedtest-cli", "stdbuf"]

[[panel]]
id = "speedtest"
entry = "panel.luau"
width = 470
height = 700

[[widget]]
id = "speedtest-widget"
entry = "widget.luau"

  [[widget.setting]]
  key             = "glyph"
  type            = "glyph"
  label_key       = "settings_glyph_label"
  description_key = "settings_glyph_description"
  default         = "brand-speedtest"
