# Misr Quran Radio - live stream of the Egyptian Holy Quran Radio
# (إذاعة القرآن الكريم من القاهرة, on air since 1964) from the Noctalia bar.
#
# One [[service]] owns every network call and the mpv playback process: it
# polls the daily programme schedule from https://API.misrquran.gov.eg and
# starts/stops `mpv --no-video` for the live HLS stream. The bar [[widget]]
# and the [[panel]] are thin clients on the plugin's shared state channels.
#
# Requires `mpv` for playback and `pkill` to stop it. The plugin only reads
# the public schedule API and plays the public live stream; it never writes
# outside its own data dir (diagnose dump).

id = "muhammadessam/misr-quran-radio"
name = "Holy Quran Radio"
version = "0.1.1"
plugin_api = 24
author = "muhammadessam"
license = "MIT"
dependencies = ["mpv", "pkill", "xdg-open"]
tags = ["bar", "panel", "service", "audio", "media", "utility"]
icon = "radio"
description = "Egyptian Holy Quran Radio live stream with the daily programme schedule."

[[setting]]
key = "stream_url"
type = "string"
label_key = "settings.stream_url.label"
description_key = "settings.stream_url.description"
default = "https://service.webvideocore.net/CL1olYogIrDWvwqiIKK7eCxOS4PStqG9DuEjAr2ZjZQtvS3d4y9r0cvRhvS17SGN/a_7a4vuubc6mo8.m3u8"
advanced = true

[[setting]]
key = "refresh_minutes"
type = "int"
label_key = "settings.refresh_minutes.label"
description_key = "settings.refresh_minutes.description"
default = 30

# Headless owner of schedule fetching and mpv playback.
[[service]]
id = "service"
entry = "service.luau"

# Bar tile: LIVE state at a glance. Click opens the panel.
[[widget]]
id = "radio"
entry = "bar.luau"

  [[widget.setting]]
  key = "show_text"
  type = "bool"
  label_key = "settings.show_text.label"
  description_key = "settings.show_text.description"
  default = true

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "radio"

# Schedule surface. Open with:
#   noctalia msg panel-toggle muhammadessam/misr-quran-radio:panel
[[panel]]
id = "panel"
entry = "panel.luau"
width = 480
height = 640
placement = "floating"
position = "center"
