# Audio Reactive Sticker - a desktop sticker that fades with audio playback.
#
#   sticker  [[desktop_widget]]  draws the image and fades it
#   monitor  [[service]]         builds bin/noctalia-audio-monitor from
#                                native/ on first run, keeps one copy alive and
#                                republishes its output as plugin state
#
# The service owns the PipeWire helper, so several sticker instances share one
# process. The helper is compiled locally: this plugin ships C source, not a
# prebuilt binary.

id           = "miixz/audio-sticker"
name         = "Audio Reactive Sticker"
version      = "1.1.1"
plugin_api   = 24
author       = "miixz"
license      = "MIT"
icon         = "photo"
description  = "Desktop sticker that fades in and out with audio playback."
tags         = ["desktop", "audio", "animation"]
dependencies = ["cc", "make", "pkg-config", "libpipewire-0.3", "ffmpeg"]

[[desktop_widget]]
id    = "sticker"
entry = "widget.luau"

[[service]]
id    = "monitor"
entry = "service.luau"

# Read when the helper starts; changes apply on the next plugin reload.
[[setting]]
key             = "hysteresis_ms"
type            = "int"
label_key       = "settings.hysteresis_ms.label"
description_key = "settings.hysteresis_ms.description"
default         = 500
min             = 0
max             = 5000
advanced        = true

[[desktop_widget.setting]]
key             = "image_path"
type            = "file"
label_key       = "settings.image_path.label"
description_key = "settings.image_path.description"
extensions      = [".png", ".jpg", ".jpeg", ".webp", ".svg", ".gif"]
default         = ""

[[desktop_widget.setting]]
key             = "active_opacity"
type            = "double"
label_key       = "settings.active_opacity.label"
description_key = "settings.active_opacity.description"
default         = 1.0
min             = 0.0
max             = 1.0
step            = 0.05

[[desktop_widget.setting]]
key             = "idle_opacity"
type            = "double"
label_key       = "settings.idle_opacity.label"
description_key = "settings.idle_opacity.description"
default         = 0.0
min             = 0.0
max             = 1.0
step            = 0.05

[[desktop_widget.setting]]
key             = "fade_ms"
type            = "int"
label_key       = "settings.fade_ms.label"
description_key = "settings.fade_ms.description"
default         = 300
min             = 0
max             = 10000
