id = "fel/radio"
name = "Radio"
version = "0.1.0"
plugin_api = 9
author = "fel"
license = "MIT"
icon = "radio"
description = "Browse radio-browser.info stations and play them headless via mpv."
dependencies = ["mpv", "socat"]
tags = ["bar", "panel", "launcher", "service", "audio", "music", "media", "network"]

[[setting]]
key = "default_volume"
type = "int"
label_key = "settings.default_volume.label"
description_key = "settings.default_volume.description"
default = 70
min = 0
max = 100

[[setting]]
key = "search_limit"
type = "int"
label_key = "settings.search_limit.label"
description_key = "settings.search_limit.description"
default = 20
min = 5
max = 50

[[setting]]
key = "country"
type = "string"
label_key = "settings.country.label"
description_key = "settings.country.description"
default = ""

[[setting]]
key = "mpv_bin"
type = "string"
label_key = "settings.mpv_bin.label"
description_key = "settings.mpv_bin.description"
default = "mpv"

[[widget]]
id = "radio"
entry = "widget.luau"

  [[widget.setting]]
  key = "show_name"
  type = "bool"
  label_key = "settings.show_name.label"
  default = true

  [[widget.setting]]
  key = "max_length"
  type = "int"
  label_key = "settings.max_length.label"
  description_key = "settings.max_length.description"
  default = 24
  min = 5
  max = 60

[[service]]
id = "player"
entry = "player.luau"

[[panel]]
id = "browser"
entry = "panel.luau"
width = 480
height = 560
placement = "floating"
position = "center"

[[launcher_provider]]
id = "finder"
entry = "finder.luau"
prefix = "radio"
glyph = "radio"
include_in_global_search = false
debounce_ms = 300
