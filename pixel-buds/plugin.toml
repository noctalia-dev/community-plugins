# Google Pixel Buds for Noctalia. Talks to Maestro-capable buds (Pixel Buds Pro,
# Pro 2) through pbpctrl (https://github.com/qzed/pbpctrl, MIT/Apache-2.0), which is NOT bundled.
# Architecture follows harveywuk/airpods (MIT): one service owns every
# subprocess, the widget and panel only read its snapshot.

id = "finoo125/pixel-buds"
name = "Pixel Buds"
version = "1.0.1"
plugin_api = 24
author = "finoo125"
license = "MIT"
icon = "headphones"
description = "Google Pixel Buds battery, noise control, EQ and settings in the bar via pbpctrl; battery only on non-Pro models."
tags = ["audio", "bar", "panel", "service", "hardware", "indicator"]
dependencies = ["pbpctrl", "bluetoothctl"]

# Plugin-level: shared by service + widget + panel. Edited in Settings -> Plugins.
[[setting]]
key = "pbpctrl_path"
type = "file"
label_key = "settings.pbpctrl_path.label"
description_key = "settings.pbpctrl_path.description"
default = ""

[[setting]]
key = "device"
type = "string"
label_key = "settings.device.label"
description_key = "settings.device.description"
default = ""

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 5

[[widget]]
id = "pixel-buds"
entry = "widget.luau"

  # Left opens the panel; right cycles the noise-control mode without opening anything.
  [widget.actions]
  left = "panel-toggle finoo125/pixel-buds:panel"
  right = "plugin finoo125/pixel-buds:service all cycle-anc"

  [[widget.setting]]
  key = "hide_when_disconnected"
  type = "bool"
  label_key = "settings.hide_when_disconnected.label"
  description_key = "settings.hide_when_disconnected.description"
  default = true

  [[widget.setting]]
  key = "show_percentage"
  type = "bool"
  label_key = "settings.show_percentage.label"
  description_key = "settings.show_percentage.description"
  default = true

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 640
placement = "attached"
position = "top_right"
open_near_click = true

[[service]]
id = "service"
entry = "service.luau"
