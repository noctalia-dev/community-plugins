# Manage SSH config hosts and keys from Noctalia.

id = "davemhammer/ssh-manager"
name = "SSH Manager"
version = "1.0.2"
plugin_api = 10
author = "davemhammer"
license = "MIT"
dependencies = ["openssh"]
tags = ["network", "development", "utility", "bar", "panel", "service"]
icon = "terminal-2"
description = "View and edit SSH config hosts, manage keys, and control the agent."

[[setting]]
key = "config_path"
type = "file"
label_key = "settings.config_path.label"
description_key = "settings.config_path.description"
default = "~/.ssh/config"

[[setting]]
key = "ssh_dir"
type = "folder"
label_key = "settings.ssh_dir.label"
description_key = "settings.ssh_dir.description"
default = "~/.ssh"

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 5
min = 2
max = 60

[[setting]]
key = "notify_on_action"
type = "bool"
label_key = "settings.notify_on_action.label"
description_key = "settings.notify_on_action.description"
default = true

[[setting]]
key = "backup_on_write"
type = "bool"
label_key = "settings.backup_on_write.label"
description_key = "settings.backup_on_write.description"
default = true

[[setting]]
key = "default_key_type"
type = "select"
label_key = "settings.default_key_type.label"
description_key = "settings.default_key_type.description"
default = "ed25519"
options = [
  { value = "ed25519", label_key = "settings.default_key_type.options.ed25519" },
  { value = "rsa", label_key = "settings.default_key_type.options.rsa" },
  { value = "ecdsa", label_key = "settings.default_key_type.options.ecdsa" }
]

[[setting]]
key = "rsa_bits"
type = "int"
label_key = "settings.rsa_bits.label"
description_key = "settings.rsa_bits.description"
default = 4096
min = 2048
max = 8192
visible_when = { key = "default_key_type", values = ["rsa"] }

[[widget]]
id = "status"
entry = "widget.luau"

  [[widget.setting]]
  key = "show_counts"
  type = "bool"
  label_key = "settings.show_counts.label"
  description_key = "settings.show_counts.description"
  default = true

[[panel]]
id = "manager"
entry = "panel.luau"
width = 620
height = 640
placement = "floating"
position = "center"
open_near_click = true
keyboard_focus = "exclusive"
dismiss_on_outside_click = true

[[service]]
id = "service"
entry = "service.luau"
