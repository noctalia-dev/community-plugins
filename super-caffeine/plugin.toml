id = "bagusk99/super-caffeine"
name = "Super Caffeine"
version = "1.0.1"
plugin_api = 17
author = "bagusk99"
license = "MIT"
icon = "coffee"
description = "One toggle for full stay-awake: Noctalia caffeine (no idle lock/sleep) plus a lid inhibitor (lid close won't suspend)."
tags = ["bar", "indicator", "productivity", "service", "shortcut", "system", "utility"]
dependencies = ["noctalia", "systemctl", "systemd-run", "systemd-inhibit", "sleep"]

[[service]]
id = "super-caffeine-service"
entry = "service.luau"

[[widget]]
id = "super-caffeine"
entry = "widget.luau"

[[shortcut]]
id = "super-caffeine-toggle"
entry = "shortcut.luau"
