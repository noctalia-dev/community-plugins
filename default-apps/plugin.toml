id           = "thaer99ob/default-apps"
name         = "Default Apps"
version      = "1.0.1"
plugin_api   = 24
author       = "Thaer99ob"
license      = "MIT"
icon         = "apps"
description  = "View and change your default applications (browser, mail, files, media, and more)."
tags         = ["utility", "system"]
dependencies = ["xdg-utils"]

[[panel]]
id        = "manager"
entry     = "panel.luau"
width     = 600
height    = 650
placement = "floating"
position  = "center"

[[widget]]
id    = "current"
entry = "widget.luau"

[[launcher_provider]]
id     = "search"
entry  = "launcher.luau"
prefix = "apps"
glyph  = "apps"
