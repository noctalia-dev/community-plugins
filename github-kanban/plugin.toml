[[widget]]
id = "github"
entry = "widget.luau"

[[panel]]
id = "kanban"
entry = "panel.luau"
width = 860
height = 620
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true

[[service]]
id = "sync"
entry = "service.luau"
