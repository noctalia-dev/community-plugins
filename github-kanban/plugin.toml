id = "shangshui0302/github-kanban"
name = "GitHub Kanban"
version = "0.1.2"
plugin_api = 24
author = "Shangshui0302"
license = "MIT"
icon = "brand-github"
description = "A read-only GitHub dashboard for activity, notifications, work, repositories, and Actions."
tags = ["bar", "panel", "service", "development", "productivity", "network", "utility"]
dependencies = ["gh", "xdg-open"]

[[setting]]
key = "refresh_interval_minutes"
type = "select"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = "15"
options = [
  { value = "5", label_key = "settings.refresh_interval.options.five" },
  { value = "15", label_key = "settings.refresh_interval.options.fifteen" },
  { value = "30", label_key = "settings.refresh_interval.options.thirty" },
]

[[setting]]
key = "default_dashboard"
type = "select"
label_key = "settings.general.default_dashboard.label"
description_key = "settings.general.default_dashboard.description"
default = "overview"
options = [
  { value = "overview", label_key = "panel.overview" },
  { value = "notifications", label_key = "panel.notifications" },
  { value = "work", label_key = "panel.activity" },
  { value = "following", label_key = "panel.feed" },
  { value = "repositories", label_key = "panel.repositories" },
]

[[setting]]
key = "bar_display_mode"
type = "select"
label_key = "settings.general.bar_display_mode.label"
description_key = "settings.general.bar_display_mode.description"
default = "both"
options = [
  { value = "icon", label_key = "settings.general.bar_display_mode.options.icon" },
  { value = "count", label_key = "settings.general.bar_display_mode.options.count" },
  { value = "both", label_key = "settings.general.bar_display_mode.options.both" },
]

# Overview
[[setting]]
key = "show_overview"
type = "bool"
label_key = "settings.overview.show.label"
description_key = "settings.overview.show.description"
default = true

# Notifications
[[setting]]
key = "show_notifications"
type = "bool"
label_key = "settings.notifications.show.label"
description_key = "settings.notifications.show.description"
default = true

[[setting]]
key = "notification_history_days"
type = "int"
label_key = "settings.notifications.history_days.label"
description_key = "settings.notifications.history_days.description"
default = 30
min = 1
max = 90
step = 1
visible_when = { key = "show_notifications", values = ["true"] }

[[setting]]
key = "notification_default_filter"
type = "select"
label_key = "settings.notifications.default_filter.label"
description_key = "settings.notifications.default_filter.description"
default = "unread"
visible_when = { key = "show_notifications", values = ["true"] }
options = [
  { value = "all", label_key = "filter.all" },
  { value = "unread", label_key = "filter.unread" },
  { value = "read", label_key = "filter.read" },
]

# Activity
[[setting]]
key = "show_activity"
type = "bool"
label_key = "settings.activity.show.label"
description_key = "settings.activity.show.description"
default = true

[[setting]]
key = "activity_history_days"
type = "int"
label_key = "settings.activity.history_days.label"
description_key = "settings.activity.history_days.description"
default = 30
min = 1
max = 365
step = 1
visible_when = { key = "show_activity", values = ["true"] }

[[setting]]
key = "pr_default_filter"
type = "select"
label_key = "settings.activity.pr_default_filter.label"
description_key = "settings.activity.pr_default_filter.description"
default = "all"
visible_when = { key = "show_activity", values = ["true"] }
options = [
  { value = "all", label_key = "filter.all" },
  { value = "created", label_key = "filter.created_by_me" },
  { value = "review", label_key = "filter.review_requested" },
]

[[setting]]
key = "issue_default_filter"
type = "select"
label_key = "settings.activity.issue_default_filter.label"
description_key = "settings.activity.issue_default_filter.description"
default = "all"
visible_when = { key = "show_activity", values = ["true"] }
options = [
  { value = "all", label_key = "filter.all" },
  { value = "created", label_key = "filter.created_by_me" },
  { value = "assigned", label_key = "filter.assigned_to_me" },
]

