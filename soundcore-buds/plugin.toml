id = "sankity/soundcore-buds"
name = "Soundcore Buds"
version = "1.0.0"
plugin_api = 24
author = "sankity"
license = "MIT"
icon = "headphones"
description = "Soundcore battery, listening mode and ANC strength in the bar via OpenSCQ30."
tags = ["audio", "bar", "panel", "service", "hardware", "indicator"]
dependencies = ["openscq30", "pactl", "paplay", "python3", "bluetoothctl", "busctl", "bash"]

# Plugin-level: shared by service + widget + panel. Edited in Settings -> Plugins.
[[setting]]
key = "openscq30_path"
type = "file"
label_key = "settings.openscq30_path.label"
description_key = "settings.openscq30_path.description"
default = ""

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 4

[[widget]]
id = "soundcore"
entry = "widget.luau"

  # Left opens the panel; right cycles the listening mode without opening anything.
  [widget.actions]
  left = "panel-toggle sankity/soundcore-buds:panel"
  right = "plugin sankity/soundcore-buds:service all cycle-noise"

  # Widget entry setting: this bar widget only.
  [[widget.setting]]
  key = "hide_when_disconnected"
  type = "bool"
  label_key = "settings.hide_when_disconnected.label"
  description_key = "settings.hide_when_disconnected.description"
  default = true

  [[widget.setting]]
  key = "icon"
  type = "select"
  label_key = "settings.icon.label"
  description_key = "settings.icon.description"
  default = "Auto"
  options = [
    { value = "Auto", label_key = "settings.icon.options.auto" },
    { value = "Earbuds", label_key = "settings.icon.options.earbuds" },
    { value = "Over-ear", label_key = "settings.icon.options.over_ear" },
  ]

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 560
placement = "attached"
position = "top_right"
open_near_click = true
capture_keys = ["o", "t", "a", "n", "f", "r"]

[[service]]
id = "service"
entry = "service.luau"
