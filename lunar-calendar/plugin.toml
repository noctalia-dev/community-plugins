# Chinese lunisolar calendar for the Noctalia bar: Gregorian date + weekday,
# lunar date, the 24 solar terms, traditional festivals and (when online) the
# statutory holiday / make-up work day data published by the State Council.
#
# plugin_api 22 is required for require("./lib/*.luau") modules.

id = "cwhirly/lunar-calendar"
name = "Lunar Calendar"
version = "1.0.0"
plugin_api = 22
author = "cwhirly"
license = "MIT"
icon = "calendar-event"
tags = ["clock", "time", "bar", "panel", "utility"]
dependencies = []
description = "Chinese lunisolar calendar: Gregorian date, weekday, lunar date, 24 solar terms, festivals and CN statutory holidays."

# ---------------------------------------------------------------------------
# Plugin-level settings: shared by the widget, the panel and the sync service,
# edited under Settings -> Plugins (the gear on this plugin's row).
# ---------------------------------------------------------------------------

[[setting]]
key = "week_start"
type = "select"
label_key = "settings.week_start.label"
description_key = "settings.week_start.description"
default = "monday"
options = [
  { value = "monday", label_key = "settings.week_start.options.monday" },
  { value = "sunday", label_key = "settings.week_start.options.sunday" },
  { value = "saturday", label_key = "settings.week_start.options.saturday" },
]

[[setting]]
key = "holiday_source"
type = "select"
label_key = "settings.holiday_source.label"
description_key = "settings.holiday_source.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.holiday_source.options.auto" },
  { value = "jsdelivr", label_key = "settings.holiday_source.options.jsdelivr" },
  { value = "github", label_key = "settings.holiday_source.options.github" },
  { value = "off", label_key = "settings.holiday_source.options.off" },
]

# ---------------------------------------------------------------------------
# Entries
# ---------------------------------------------------------------------------

# Bar widget: date + weekday + lunar date + solar term / festival / holiday.
[[widget]]
id = "calendar"
entry = "widget.luau"

  [[widget.setting]]
  key = "primary"
  type = "select"
  label_key = "settings.primary.label"
  description_key = "settings.primary.description"
  default = "solar"
  options = [
    { value = "solar", label_key = "settings.primary.options.solar" },
    { value = "lunar", label_key = "settings.primary.options.lunar" },
    { value = "both", label_key = "settings.primary.options.both" },
  ]

  [[widget.setting]]
  key = "secondary"
  type = "select"
  label_key = "settings.secondary.label"
  description_key = "settings.secondary.description"
  default = "lunar_plus"
  options = [
    { value = "lunar_plus", label_key = "settings.secondary.options.lunar_plus" },
    { value = "auto", label_key = "settings.secondary.options.auto" },
    { value = "lunar", label_key = "settings.secondary.options.lunar" },
    { value = "none", label_key = "settings.secondary.options.none" },
  ]

  [[widget.setting]]
  key = "show_weekday"
  type = "bool"
  label_key = "settings.show_weekday.label"
  description_key = "settings.show_weekday.description"
  default = true

  [[widget.setting]]
  key = "show_glyph"
  type = "bool"
  label_key = "settings.show_glyph.label"
  default = true

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "calendar-event"

# Month panel: the calendar grid with lunar days, solar terms and holidays.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 430
height = 620
placement = "attached"
open_near_click = true

# Headless service: keeps the statutory-holiday data fresh and publishes it on
# the plugin state channel for the widget and the panel.
[[service]]
id = "holiday-sync"
entry = "service.luau"
