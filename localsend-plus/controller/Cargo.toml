[package]
name = "localsend-controller"
version = "2.4.0"
description = "LocalSend receiver and sender for the LocalSend Plus Noctalia plugin"
license = "MIT"
rust-version = "1.97"
edition = "2021"

[dependencies]
anyhow = "1.0"
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
localsend = { git = "https://github.com/localsend/localsend.git", rev = "82abda323d7c87e0f6dc09d8fd6a55d64c70d443", default-features = false, features = ["discovery"] }
mime_guess = "2.0"
pem = "4.0"
rcgen = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.49", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.20", features = ["serde", "v4"] }

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[dev-dependencies]
tempfile = "3.24"

# The LocalSend core generates an RSA-2048 key for every new identity. Its
# unoptimized bignum code takes seconds per key, long enough to time out
# the tests that start many daemons at once, so dependencies are optimized
# in debug builds too. The controller's own code stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
