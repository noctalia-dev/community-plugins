id = "etrigan63/rum-updates"
name = "RUM Updates"
version = "0.1.6"
author = "etrigan63"
license = "MIT"
icon = "package"
description = "Monitor and manage RakuOS updates with rum."
plugin_api = 3
tags = ["system", "utility"]
dependencies = ["rum", "rakuos-software", "sh", "sudo"]

[[setting]]
key = "interval"
type = "int"
label_key = "settings.interval.label"
description_key = "settings.interval.description"
default = 300
min = 60
max = 86400

[[setting]]
key = "notify"
type = "bool"
label_key = "settings.notify.label"
description_key = "settings.notify.description"
default = false

[[service]]
id = "update_poller"
entry = "poller.luau"

[[widget]]
id = "rum_updates"
entry = "widget.luau"

[[widget.setting]]
key = "hide_when_empty"
type = "bool"
label_key = "settings.hide_when_empty.label"
description_key = "settings.hide_when_empty.description"
default = true

[[widget.setting]]
key = "glyph"
type = "glyph"
label_key = "settings.glyph.label"
description_key = "settings.glyph.description"
default = "package"

[[widget.setting]]
key = "click_action"
type = "select"
label_key = "settings.click_action.label"
description_key = "settings.click_action.description"
default = "run_updater"
options = [
  { value = "open_software_center", label_key = "settings.click_action.options.open_software_center" },
  { value = "run_updater", label_key = "settings.click_action.options.run_updater" }
]

[[widget.setting]]
key = "terminal_application"
type = "string"
label_key = "settings.terminal_application.label"
description_key = "settings.terminal_application.description"
default = ""
visible_when = { key = "click_action", values = ["run_updater"] }
