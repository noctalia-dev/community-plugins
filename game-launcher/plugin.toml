id = "alexander/game-launcher"
name = "Game Launcher"
version = "1.5.0"
plugin_api = 13
author = "Alexander"
license = "MIT"
icon = "device-gamepad-2"
description = "Browse and launch games from Steam, Lutris, and Heroic."
dependencies = ["cc", "xdg-utils"]
tags = ["gaming", "launcher", "utility"]

[[setting]]
key = "panel_mode"
type = "select"
label_key = "settings.panel_mode.label"
description_key = "settings.panel_mode.description"
default = "original"
options = [
  { value = "side", label_key = "settings.panel_mode.side" },
  { value = "original", label_key = "settings.panel_mode.original" },
]

[[setting]]
key = "steam_enabled"
type = "bool"
label_key = "settings.steam_enabled.label"
default = true

[[setting]]
key = "heroic_enabled"
type = "bool"
label_key = "settings.heroic_enabled.label"
default = true

[[setting]]
key = "lutris_enabled"
type = "bool"
label_key = "settings.lutris_enabled.label"
default = true

[[setting]]
key = "steampoacher_enabled"
type = "bool"
label_key = "settings.steampoacher_enabled.label"
default = false
advanced = true

[[widget]]
id = "launcher"
entry = "widget.luau"

[[widget.setting]]
key = "glyph"
type = "glyph"
label_key = "settings.glyph.label"
default = "device-gamepad-2"

[[panel]]
id = "browser"
entry = "panel.luau"
width = 380
height = "fill"
placement = "floating"
position = "center_right"
open_near_click = false
capture_keys = ["Up", "Down", "Return"]

[[panel]]
id = "original"
entry = "original.luau"
width = 720
height = 560
placement = "floating"
position = "center"
open_near_click = false
capture_keys = ["Up", "Down", "Return"]

[[launcher_provider]]
id = "search"
entry = "search.luau"
prefix = "g"
glyph = "device-gamepad-2"
include_in_global_search = true
debounce_ms = 150
