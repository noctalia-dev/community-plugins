id           = "nid25/sleep_timer"
name         = "Sleep Timer"
version      = "2.3.0"
# 52: translateY (layers over the dial); also pixel streams, module require, gesture defaults
plugin_api   = 52
author       = "nid25"
license      = "MIT"
icon         = "moon"
description  = "Shut down the computer after a set time, from a bar dial, a draggable dial panel or a Control Center tile."
tags         = ["bar", "panel", "shortcut", "countdown", "system", "utility"]
# systemd-run, systemctl: the plugin's own systemd user timer that runs `systemctl poweroff`
# python3: companion.py, the pointer layer that lets the dial knob be dragged
dependencies = ["systemd-run", "systemctl", "python3"]

[[setting]]
key             = "font_family"
type            = "string"
label_key       = "settings.font_family.label"
description_key = "settings.font_family.description"
default         = ""

# The bar widget API cannot read the bar thickness, so the dial size is a setting
[[setting]]
key             = "dial_size"
type            = "int"
label_key       = "settings.dial_size.label"
description_key = "settings.dial_size.description"
default         = 27
min             = 12
max             = 64
step            = 1

[[widget]]
id    = "sleep_timer"
entry = "widget.luau"

  # Frees middle click (by default it opens the widget settings) to open the panel
  [widget.actions]
  middle = "none"

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 380
height          = "content"
max_height      = 720
placement       = "attached"
open_near_click = true

[[shortcut]]
id    = "tile"
entry = "shortcut.luau"
