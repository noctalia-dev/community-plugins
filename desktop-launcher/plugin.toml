id = "yocraft/desktop-launcher"
name = "Desktop Launcher"
version = "1.0.0"
plugin_api = 3
author = "yocraft"
license = "MIT"
deprecated = false
icon = "launcher"
description = "Launch your favorite apps from your desktop in one click."
tags = [ "desktop", "utility" ]
dependencies = []

[[desktop_widget]]
id = "widget"
entry = "widget.luau"

    [[desktop_widget.setting]]
    key = "apps"
    type = "string_list"
    label_key = "settings.apps.label"
    default = [
        "firefox",
        "foot",
        "nvim",
    ]

    [[desktop_widget.setting]]
    key = "layout"
    type = "select"
    label_key = "settings.layout.label"
    default = "rows"
    options = [
        { value = "rows", label_key = "settings.layout.rows" },
        { value = "columns", label_key = "settings.layout.columns" },
    ]
