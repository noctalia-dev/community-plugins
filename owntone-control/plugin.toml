id          = "danielel/owntone-control"
name        = "OwnTone Control"
version     = "0.3.1"
plugin_api  = 12
author      = "danielel"
license     = "MIT"
icon        = "music"
description = "Play/pause, volume, now-playing, and audio outputs panel for OwnTone — no browser needed."
tags        = ["bar", "audio", "network", "panel", "utility"]
dependencies = []

# Plugin-wide settings (readable from service, widget, and panel).
[[setting]]
key             = "host"
type            = "string"
label_key       = "settings.host.label"
description_key = "settings.host.description"
default         = "127.0.0.1:3689"

[[setting]]
key             = "poll_seconds"
type            = "int"
label_key       = "settings.poll_seconds.label"
description_key = "settings.poll_seconds.description"
default         = 3

[[setting]]
key             = "username"
type            = "string"
label_key       = "settings.username.label"
description_key = "settings.username.description"
default         = ""

[[setting]]
key             = "password"
type            = "string"
label_key       = "settings.password.label"
description_key = "settings.password.description"
default         = ""

# ---------------------------------------------------------------------------
# Service: polls OwnTone's JSON API on an interval, publishes normalized
# status via noctalia.state so the widget and panel have no network logic
# of their own for reading state.
# ---------------------------------------------------------------------------

[[service]]
id    = "poller"
entry = "service.luau"

# ---------------------------------------------------------------------------
# Bar widget: shows now-playing / state, click opens panel, right-click toggles
# play/pause, scroll adjusts volume, onIpc exposes shortcuts.
# ---------------------------------------------------------------------------

[[widget]]
id    = "owntone"
entry = "widget.luau"

  [[widget.setting]]
  key             = "glyph"
  type            = "glyph"
  label_key       = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default         = "music"

# ---------------------------------------------------------------------------
# Panel: full now-playing dashboard, playback controls, master volume,
# and multi-room audio output management.
# ---------------------------------------------------------------------------

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 380
height          = 520
placement       = "attached"
position        = "auto"
open_near_click = true
