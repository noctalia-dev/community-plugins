# media-lyrics — Noctalia v5 plugin: media player panel with synced lyrics.
#
# Pure-Luau media panel: polls Noctalia's own D-Bus MPRIS aggregator
# (dev.noctalia.Mpris) from a [[service]], fetches synced lyrics from
# LRCLIB (exact /api/get first, then /api/search fallback), parses LRC in
# pure Luau, caches locally, and exposes everything to the [[panel]] over
# noctalia.state. Runtime needs busctl (MPRIS poll) and curl (LRCLIB HTTPS).
#
# Open the panel:  noctalia msg panel-toggle tranzem/media-lyrics:panel

id = "tranzem/media-lyrics"
name = "Media Lyrics"
version = "0.9.9"
plugin_api = 43
author = "tranzem"
license = "MIT"
tags = ["media", "music", "panel", "service", "desktop"]
icon = "music"
description = "Synced lyrics panel and desktop widget: karaoke carousel, seekable progress, audio-reactive chip. Needs busctl + curl."
dependencies = ["busctl", "curl"]

[[setting]]
key = "offset_ms"
type = "int"
label_key = "settings.offset_ms.label"
description_key = "settings.offset_ms.description"
default = 0
# Without min/max the host falls back to its default slider range (0..100), so
# the control could not express a shift larger than a tenth of a second and
# negative values were unreachable. Expose the full useful range.
min = -2000
max = 2000

[[setting]]
key = "panel_size"
type = "select"
label_key = "settings.panel_size.label"
description_key = "settings.panel_size.description"
default = "medium"
options = [
  { value = "mini", label_key = "settings.panel_size.options.mini" },
  { value = "compact", label_key = "settings.panel_size.options.compact" },
  { value = "medium", label_key = "settings.panel_size.options.medium" },
  { value = "large", label_key = "settings.panel_size.options.large" },
]

[[setting]]
key = "use_cache"
type = "bool"
label_key = "settings.use_cache.label"
description_key = "settings.use_cache.description"
default = true

[[setting]]
key = "local_lyrics_dir"
type = "folder"
label_key = "settings.local_lyrics_dir.label"
description_key = "settings.local_lyrics_dir.description"
default = "~/.local/share/media-lyrics"

# Player filtering: comma-separated identity or bus-name substrings. When
# allowlist is non-empty, only matching players are shown; blocklist excludes
# matching players. Empty = no filtering (show the active player).
[[setting]]
key = "player_allowlist"
type = "string"
label_key = "settings.player_allowlist.label"
description_key = "settings.player_allowlist.description"
default = ""

[[setting]]
key = "player_blocklist"
type = "string"
label_key = "settings.player_blocklist.label"
description_key = "settings.player_blocklist.description"
default = ""

# Bar widget: compact now-playing chip; opens the panel on click.
[[widget]]
id = "now-playing"
entry = "widget.luau"

  # Gestures mirror the shell's built-in media widget (noctalia-dev/noctalia
  # src/shell/bar/widget_gesture_defaults.cpp): right toggles playback, thumb
  # buttons and the scroll wheel skip tracks. Middle is deliberately NOT
  # bound here — every widget gets the host default `settings-open-widget`,
  # so middle click opens this widget's settings like any other bar app.
  [widget.actions]
  right       = "media toggle"
  back        = "media previous"
  forward     = "media next"
  scroll_up   = "media next"
  scroll_down = "media previous"

  # Display settings — same knobs as the shell's built-in media widget
  # (media_widget_definition.cpp). Edited in the widget's own settings popup
  # (middle click) and read with noctalia.getConfig(key) in widget.luau.
  [[widget.setting]]
  key = "album_art_only"
  type = "bool"
  label_key = "settings.album_art_only.label"
  description_key = "settings.album_art_only.description"
  default = false

  [[widget.setting]]
  key = "hide_album_art"
  type = "bool"
  label_key = "settings.hide_album_art.label"
  description_key = "settings.hide_album_art.description"
  default = false
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "hide_artist"
  type = "bool"
  label_key = "settings.hide_artist.label"
  description_key = "settings.hide_artist.description"
  default = false
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "artist_first"
  type = "bool"
  label_key = "settings.artist_first.label"
  description_key = "settings.artist_first.description"
  default = false
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "min_length"
  type = "int"
  label_key = "settings.min_length.label"
  description_key = "settings.min_length.description"
  default = 80
  min = 0
  max = 800
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "max_length"
  type = "int"
  label_key = "settings.max_length.label"
  description_key = "settings.max_length.description"
  default = 220
  min = 40
  max = 800
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "art_size"
  type = "int"
  label_key = "settings.art_size.label"
  description_key = "settings.art_size.description"
  default = 16
  min = 8
  max = 96
  visible_when = { key = "hide_album_art", values = ["false"] }

  [[widget.setting]]
  key = "title_scroll"
  type = "select"
  label_key = "settings.title_scroll.label"
  description_key = "settings.title_scroll.description"
  default = "none"
  options = [
    { value = "none", label_key = "settings.title_scroll.options.none" },
    { value = "always", label_key = "settings.title_scroll.options.always" },
    { value = "on_hover", label_key = "settings.title_scroll.options.on_hover" },
  ]
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "hide_when_no_media"
  type = "bool"
  label_key = "settings.hide_when_no_media.label"
  description_key = "settings.hide_when_no_media.description"
  default = false

  # Extra (beyond the built-in media widget): show the current synced lyric
  # line in the chip instead of the artist while lyrics are ready.
  [[widget.setting]]
  key = "show_lyric_line"
  type = "bool"
  label_key = "settings.show_lyric_line.label"
  description_key = "settings.show_lyric_line.description"
  default = false
  visible_when = { key = "album_art_only", values = ["false"] }

  # (show_progress was dropped — see ROADMAP "show_progress in bar widget")

  # Audio-reactive chip: with `audio_spectrum` on, the host feeds this widget
  # the PipeWire monitor spectrum through onAudioSpectrum() at ~60 Hz
  # (coalesced) and the chip draws a small band meter. Both keys are plain
  # widget settings understood by the host itself (plugin_widget.cpp:
  # settingBool "audio_spectrum" / settingInt "audio_spectrum_bands") — this is
  # NOT gated by a plugin API level. Verified live on Noctalia 5.2.0.
  [[widget.setting]]
  key = "audio_spectrum"
  type = "bool"
  label_key = "settings.audio_spectrum.label"
  description_key = "settings.audio_spectrum.description"
  default = false
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "audio_spectrum_bands"
  type = "int"
  label_key = "settings.audio_spectrum_bands.label"
  description_key = "settings.audio_spectrum_bands.description"
  default = 8
  min = 1
  max = 64
  visible_when = { key = "audio_spectrum", values = ["true"] }

# Desktop widget: the same now-playing/lyrics view as a background layer-shell
# tile pinned to the desktop (and visible on the lockscreen), independent of any
# panel. This is what the "pin to desktop" roadmap item actually needs — a
# persistent panel still disappears when no panel surface is up, a desktop
# widget does not. Available at plugin_api 20 (official-plugins/timer ships one),
# so it costs us nothing in compatibility. Verified live on Noctalia 5.2.0.
#
# ORDER MATTERS: this block sits immediately after [[widget]]. Declared last
# (after [[shortcut]]) the host silently drops it — the plugin still loads, but
# reports one entry fewer and `desktop_widgets.widget.<name>.type =
# "<id>:desktop"` is rejected as an unrecognized type. Verified both ways.
[[desktop_widget]]
id = "desktop"
entry = "desktop.luau"

  # Fixed widget width in logical pixels. The widget is auto-sized by default, so
  # without this every longer lyric line widens the surface and every shorter one
  # narrows it again. The editor's box_width does the same job if it is set.
  [[desktop_widget.setting]]
  key = "width"
  type = "int"
  label_key = "settings.desktop_width.label"
  description_key = "settings.desktop_width.description"
  default = 320
  min = 160
  max = 900

  # Opt-in card look. The built-in desktop widgets put their content straight on
  # the wallpaper with no frame, so the widget matches that by default and this
  # only adds a surface behind it when asked.
  [[desktop_widget.setting]]
  key = "background"
  type = "bool"
  label_key = "settings.desktop_background.label"
  description_key = "settings.desktop_background.description"
  default = false

  [[desktop_widget.setting]]
  key = "show_artist"
  type = "bool"
  label_key = "settings.desktop_show_artist.label"
  description_key = "settings.desktop_show_artist.description"
  default = true

  [[desktop_widget.setting]]
  key = "show_cover"
  type = "bool"
  label_key = "settings.desktop_show_cover.label"
  description_key = "settings.desktop_show_cover.description"
  default = true

  [[desktop_widget.setting]]
  key = "lines"
  type = "int"
  label_key = "settings.desktop_lines.label"
  description_key = "settings.desktop_lines.description"
  default = 3
  min = 1
  max = 9

# Background service: polls D-Bus for player state, fetches + parses lyrics,
# and publishes a snapshot to noctalia.state for the panel.
[[service]]
id = "service"
entry = "service.luau"

# Main panel: header (cover | title/artist | transport) + karaoke lyrics view.
# Three size presets share one entry; panel_size selects which one the widget
# and the control-center tile open. Medium (520) is the default and keeps the
# historical `panel` id for IPC compatibility.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 520
height = 520
placement = "floating"
position = "center"
# Overlay layer keeps the lyrics above fullscreen windows (karaoke over
# video). Per-entry Layer dropdown in Settings -> Plugins can switch any
# preset back to "top" without editing the manifest.
layer = "overlay"
keyboard_focus = "exclusive"
capture_keys = ["Up", "Down", "Return", "Space"]

[[panel]]
id = "panel-compact"
entry = "panel.luau"
width = 440
height = 440
layer = "overlay"
keyboard_focus = "exclusive"
capture_keys = ["Up", "Down", "Return", "Space"]

[[panel]]
id = "panel-large"
entry = "panel.luau"
width = 640
height = 640
layer = "overlay"
keyboard_focus = "exclusive"
capture_keys = ["Up", "Down", "Return", "Space"]

# Compact mini panel: cover + current lyric line only, PINNED to the desktop
# (placement = "floating", position = "center"). A lightweight always-on
# karaoke line without the full transport/header chrome.
#
# `persistent = true` (plugin_api 11) is what makes the pinning real: a normal
# panel is dismissed when any other panel opens (the shell keeps one open at a
# time), so without this flag the mini chip vanished the moment the user opened
# the control center or any other panel. A persistent panel lives outside that
# slot and stays until an explicit toggle / panel.close() /
# `noctalia ipc panel-close <id>`. Verified live: with the flag the chip
# survives opening and closing another panel (log: `[persistent-panel] opened`).
#
# Persistent panels are always floating and cannot take exclusive keyboard
# focus - panel-mini already declares keyboard_focus = "none" and
# dismiss_on_outside_click = false, which is exactly what they require.
[[panel]]
id = "panel-mini"
entry = "panel-mini.luau"
width = 360
height = 120
placement = "floating"
position = "center"
layer = "overlay"
keyboard_focus = "none"
dismiss_on_outside_click = false
persistent = true

# Control-center tile: quick panel open.
[[shortcut]]
id = "toggle"
entry = "shortcut.luau"
